<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA</title>
    <link rel="icon" href="ordenar.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos para Filtros e Status (Igual ao OS) */
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            background: white;
            color: #1a237e;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #1a237e;
            color: white;
        }
        .status-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-ativa { background: #d4edda; color: #155724; }
        .status-inativa { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">ORDENA | Sistema de Gestão</div>
        <div class="menu">
            <a href="index.html">Dashboard</a>
            <a href="cadastro.html" class="active">Viaturas</a>
            <a href="enderecos.html">Locais</a>
            <a href="os.html">Ordens de Serviço</a>
            <a href="escalamento.html">Ativação</a>
            <a href="historico.html">Histórico</a> </div>
    </nav>

    <main>
        <div class="card-container-main">
            <h2 id="tituloForm">Cadastrar Nova Viatura</h2>
            <form id="viaturaForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="row">
                    <div class="col-1">
                        <label>Prefixo Operacional</label>
                        <input type="text" id="prefixo" class="input-padrao" placeholder="Ex: 80-1234" required>
                    </div>
                    <div class="col-1">
                        <label>Placa Oficial</label>
                        <input type="text" id="placa" class="input-padrao" placeholder="ABC-1234" required>
                    </div>
                    <div class="col-1">
                        <label>Identificador Rádio</label>
                        <input type="text" id="radio" class="input-padrao" placeholder="ID Digital" required>
                    </div>
                </div>

                <div class="row">
                    <button type="submit" id="btnSalvar" class="btn-primary" style="width: 100%;">Salvar Registro</button>
                    <button type="button" id="btnCancelar" class="btn-secondary" style="display:none; width: 100%; margin-top: 10px;" onclick="cancelarEdicao()">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card-container-main" style="margin-top: 30px;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>Frota Cadastrada</h2>
                
                <div style="display: flex; gap: 10px;">
                    <button onclick="mudarFiltro('Ativa')" id="btnFiltroAtiva" class="filter-btn active">Ver Ativas</button>
                    <button onclick="mudarFiltro('Inativa')" id="btnFiltroInativa" class="filter-btn">Ver Inativas</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Prefixo</th>
                            <th>Placa</th>
                            <th>Rádio</th>
                            <th>Status</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaViaturas"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
