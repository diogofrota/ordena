<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Mapa Tático Real-Time</title>
    <link rel="icon" href="ordenar.png" type="image/x-icon">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        /* Layout Específico do Mapa Tático */
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* BARRA DE KPIS (DASHBOARD) */
        .kpi-bar {
            background: white;
            padding: 15px 30px; /* Mais espaçamento lateral */
            display: flex;
            justify-content: center; /* CENTRALIZA OS CARDS */
            align-items: stretch;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 10;
            flex-wrap: wrap; /* Permite quebrar linha em telas muito pequenas */
        }

        .kpi-card {
            background: #fff;
            border-left: 5px solid var(--primary-color);
            border-radius: 8px;
            padding: 15px 10px;
            
            /* Lógica de Tamanho e Alinhamento */
            flex: 1;             /* Cresce para ocupar espaço igual */
            min-width: 150px;    /* Tamanho mínimo */
            max-width: 250px;    /* Tamanho máximo para não ficar gigante */
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* Centraliza conteúdo interno */
            text-align: center;
            
            box-shadow: 0 2px 6px rgba(0,0,0,0.05); /* Sombra suave */
            transition: transform 0.2s;
        }

        .kpi-card:hover { transform: translateY(-3px); }

        .kpi-card span { 
            font-size: 0.75rem; 
            color: #777; 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .kpi-card strong { 
            font-size: 2rem; 
            color: #333; 
            line-height: 1;
        }

        /* Cores das Bordas */
        .bord-blue { border-left-color: #1a237e; }
        .bord-green { border-left-color: #28a745; }
        .bord-orange { border-left-color: #fd7e14; }
        .bord-red { border-left-color: #dc3545; }

        /* MAPA */
        #mapaOperacional {
            flex: 1;
            width: 100%;
            background: #e5e5e5;
            z-index: 1;
        }

        /* Ícones Personalizados no Mapa */
        .custom-div-icon { background: transparent; border: none; }
        .marker-pin {
            width: 40px; height: 40px;
            border-radius: 50% 50% 50% 0;
            background: #1a237e;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%; top: 50%;
            margin: -20px 0 0 -20px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid white;
        }
        .marker-pin::after {
            content: ''; width: 24px; height: 24px;
            margin: 8px 0 0 8px; background: #fff;
            position: absolute; border-radius: 50%;
        }
        .marker-icon {
            position: absolute; width: 100%;
            font-size: 22px; text-align: center;
            top: -2px; transform: rotate(45deg);
            z-index: 10;
        }

        /* Cores dos Pinos */
        .pin-viatura { background: #1a237e; }
        .pin-moto { background: #fd7e14; }
        .pin-setor { background: #28a745; }
        .pin-cabine { background: #6f42c1; }

        /* Popup */
        .leaflet-popup-content-wrapper { border-radius: 8px; font-family: 'Segoe UI', sans-serif; }
        .popup-header { background: #f8f9fa; padding: 5px 10px; border-bottom: 1px solid #eee; font-weight: bold; color: #1a237e; }
        .popup-body { padding: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="kpi-bar">
        <div class="kpi-card bord-blue">
            <span>Efetivo Total</span>
            <strong id="kpiEfetivo">0</strong>
        </div>
        <div class="kpi-card bord-blue">

        </div>

    </div>
