<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGF - Ordem de Serviço</title>
    <link rel="icon" href="ordenar.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <nav>
        <div class="logo">🚓 SGF | Planejamento</div>
        <div class="menu">
            <a href="index.html">Visão Geral</a>
            <a href="cadastro.html">Frota</a>
            <a href="os.html" class="active">Ordens</a>
            <a href="escalamento.html">Operações</a>
        </div>
    </nav>

    <main>
        <div class="card-container-main">
            <h2 id="formTitle">Nova Ordem de Serviço</h2>
            
            <div id="cabecalhoOS">
                <div class="row">
                    <div class="col-1">
                        <label class="label-resumo">Nº OS</label>
                        <input type="text" id="numOS" readonly class="input-padrao" style="background: #e9ecef; font-weight: bold; text-align: center;">
                    </div>
                    <div class="col-3">
                        <label class="label-resumo">Missão / Operação</label>
                        <input type="text" id="nomeOS" placeholder="Descrição da missão" class="input-padrao">
                    </div>
                </div>

                <div class="row" style="align-items: flex-end;">
                    <div class="col-1">
                        <label class="label-resumo">Início Turno</label>
                        <input type="time" id="inicioGeral" class="input-padrao">
                    </div>
                    <div class="col-1">
                        <label class="label-resumo">Término Turno</label>
                        <input type="time" id="terminoGeral" class="input-padrao">
                    </div>
                    <div class="col-2">
                        <button onclick="liberarFracionamento()" id="btnCriarOS" class="btn-primary" style="width: 100%;">Criar OS e Fracionar</button>
                    </div>
                </div>
            </div>

            <div id="areaFracionamento" style="display: none; margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 25px;">
                <h3 style="margin-bottom: 20px;">Roteiro de Atividades</h3>
                
                <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef;">
                    <div class="row">
                        <div class="col-2">
                            <label>Tipo de Atividade</label>
                            <select id="tipoAtividade" class="input-padrao">
                                <option value="Patrulhamento">Patrulhamento</option>
                                <option value="Baseamento">Baseamento</option>
                                <option value="Intervalo">Intervalo</option>
                                <option value="Deslocamento">Deslocamento</option>
                            </select>
                        </div>
                        <div class="col-1">
                            <label>De</label>
                            <input type="time" id="inicioFracao" class="input-padrao">
                        </div>
                        <div class="col-1">
                            <label>Até</label>
                            <input type="time" id="terminoFracao" class="input-padrao">
                        </div>
                    </div>

                    <div class="row" style="align-items: flex-end;">
                        <div class="col-3">
                            <label>Localização / Ponto Focal</label>
                            <input type="text" id="localAtividade" placeholder="Logradouro ou Ponto de Referência" class="input-padrao">
                        </div>
                        <div class="col-1">
                            <button type="button" onclick="adicionarFracao()" class="btn-info" style="width: 100%;">
                                + Adicionar
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive" style="margin-top: 20px;">
                    <table>
                        <thead>
                            <tr><th>Atividade</th><th>Início</th><th>Fim</th><th>Local</th><th style="text-align: center;">Ação</th></tr>
                        </thead>
                        <tbody id="tabelaFracoesTemp"></tbody>
                    </table>
                </div>

                <div style="margin-top: 30px;">
                    <button onclick="finalizarOS()" id="btnFinalizar" class="btn-success" style="width: 100%; height: 55px; font-size: 1.1rem;">
                        Finalizar e Gravar OS
                    </button>
                </div>
            </div>
        </div>

        <div class="card-container-main" style="margin-top: 30px;">
            <h2>Histórico de Ordens</h2>
            <div class="table-responsive">
                <table id="tabelaOSPrincipal">
                    <thead>
                        <tr>
                            <th>Nº OS</th>
                            <th>Missão</th>
                            <th>Turno Geral</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabelaOS"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="os.js"></script>
</body>
</html>
