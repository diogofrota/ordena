<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Operações Especiais</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            background: #fff;
            color: #1a237e;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .filter-btn.active {
            background: #1a237e;
            color: #fff;
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18);
        }

        .btn-voltar-operacao {
            background: white;
            border: 1px solid #6c757d;
            border-radius: 20px;
            box-shadow: none;
            color: #6c757d;
            min-width: 84px;
        }

        .cadastro-link {
            border-color: #3f7f50;
            color: #3f7f50;
        }

        .filter-btn-inativa {
            border-color: #a45f5f;
            color: #a45f5f;
        }

        .filter-btn-inativa.active {
            background: #a45f5f;
            border-color: #a45f5f;
            color: #fff;
        }

        .operacoes-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .operacoes-list-header h2 {
            margin: 0;
        }

        .operacoes-list-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .operacoes-table-wrapper {
            margin-top: 22px;
        }

        .operacoes-table {
            min-width: 980px;
        }

        .operacao-row.com-alerta td:first-child {
            border-left: 5px solid #fd7e14;
        }

        .operacao-row.aberta {
            background: #f7f8fc;
        }

        .status-operacao-cell {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .avaliacao-indisponivel {
            color: #666;
            font-size: 0.86rem;
        }

        .acoes-operacao-cell {
            text-align: center;
        }

        .acoes-operacao {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-avaliacoes-operacao,
        .btn-detalhes-operacao,
        .btn-inativar-operacao {
            min-width: 105px;
        }

        .btn-avaliacoes-operacao {
            min-width: 145px;
        }

        .mensagem-tabela-operacoes td {
            padding: 24px;
            color: #666;
            text-align: center;
        }

        .mensagem-tabela-operacoes.erro td {
            color: #721c24;
            background: #f8d7da;
        }

        .campo-obrigatorio {
            color: #d32f2f;
        }

        textarea.input-padrao {
            min-height: 100px;
            height: auto;
            resize: vertical;
            font-family: inherit;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .input-padrao[readonly] {
            background: #e9ecef;
            color: #555;
            cursor: not-allowed;
            font-weight: 600;
        }

        .operacao-feedback {
            display: none;
            margin-bottom: 18px;
            padding: 12px 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .operacao-feedback.is-visible {
            display: block;
        }

        .operacao-feedback.success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .operacao-feedback.error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .operacoes-page button:disabled,
        #modalFeedbackOperacao button:disabled,
        #modalInativarOperacao button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            filter: none;
        }

        .growing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 18px;
            margin-left: 8px;
        }

        .growing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            animation: operation-dot-grow 1.2s infinite ease-in-out;
        }

        .growing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .growing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes operation-dot-grow {
            0%, 60%, 100% { transform: scale(0.65); opacity: 0.45; }
            30% { transform: scale(1); opacity: 1; }
        }

        .nome-op {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1a237e;
            line-height: 1.2;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .detalhes-op {
            margin-top: 12px;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }

        .detalhes-op[hidden] {
            display: none !important;
        }

        .descricao-op {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 0.92rem;
            color: #333;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(170px, 1fr));
            gap: 10px;
        }

        .meta-item {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 10px;
        }

        .meta-item span {
            display: block;
            color: #666;
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .meta-item strong {
            font-size: 0.92rem;
            color: #222;
            word-break: break-word;
            display: block;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-ativa {
            background: #d4edda;
            color: #155724;
        }

        .status-inativa {
            background: #f8d7da;
            color: #721c24;
        }

        .status-warning {
            background: #fff3cd;
            color: #8a5600;
            border: 1px solid #f4d58a;
        }

        .status-feedback-pendente {
            background: #fff3cd;
            color: #8a5600;
            border: 1px solid #f4d58a;
        }

        .status-feedback-concluido {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .alertas-gerais {
            display: none;
            margin-bottom: 14px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #f4d58a;
            background: #fff7dc;
            color: #6e4900;
        }

        .alertas-gerais.ativo {
            display: block;
        }

        .alertas-titulo {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .alertas-lista {
            margin: 0;
            padding-left: 18px;
        }

        .alertas-lista li {
            margin-bottom: 4px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .alerta-op {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #f4d58a;
            background: #fff7dc;
            color: #6e4900;
            font-size: 0.9rem;
        }

        .lista-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            color: #555;
            font-weight: 600;
        }


        .feedback-modal-description {
            color: #666;
            font-size: 0.92rem;
            line-height: 1.45;
            margin: 0 0 18px;
        }

        .avaliacoes-historico {
            margin-bottom: 20px;
            padding: 16px;
            border: 1px solid #e1e5ea;
            border-radius: 8px;
            background: #f8f9fa;
        }

        .avaliacoes-historico-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .avaliacoes-historico-header h4,
        .avaliacao-form-title {
            color: #1a237e;
            font-size: 1rem;
            margin: 0;
        }

        .avaliacoes-lista {
            display: grid;
            gap: 10px;
        }

        .avaliacao-card {
            padding: 12px 14px;
            border: 1px solid #e4e7eb;
            border-left: 4px solid #1a237e;
            border-radius: 6px;
            background: #fff;
        }

        .avaliacao-card-data {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .avaliacao-card-texto {
            margin: 0;
            color: #333;
            font-size: 0.92rem;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .avaliacoes-vazio {
            margin: 0;
            padding: 18px;
            border: 1px dashed #c9ced4;
            border-radius: 6px;
            background: #fff;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
        }

        .avaliacao-form-title {
            margin-bottom: 12px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
        }

        .modal-overlay[hidden] {
            display: none !important;
        }

        .modal-card {
            width: 100%;
            max-width: 720px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding: 24px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .modal-card h3 {
            color: #1a237e;
            margin: 0 0 4px;
        }

        .modal-card-confirmacao {
            max-width: 540px;
        }

        .modal-confirmacao-texto {
            color: #555;
            margin: 0 0 18px;
        }

        .modal-operation-name {
            color: #555;
            font-weight: 700;
            margin: 0 0 14px;
        }

        .modal-divider {
            border-bottom: 1px solid #eee;
            margin-bottom: 16px;
        }

        body.modal-aberto {
            overflow: hidden;
        }

        @media (max-width: 860px) {
            .meta-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .operacoes-list-header {
                align-items: stretch;
                flex-direction: column;
            }

            .operacoes-list-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }

            .operacoes-list-actions .cadastro-link,
            .operacoes-list-actions .btn-voltar-operacao {
                grid-column: 1 / -1;
            }

            .operacoes-list-actions button {
                margin-bottom: 0 !important;
            }

            .operacoes-table {
                min-width: 0;
            }

            .status-operacao-cell {
                justify-content: flex-end;
            }

            .acoes-operacao {
                display: grid;
                grid-template-columns: 1fr;
                width: 100%;
            }

            .acoes-operacao-cell {
                display: block !important;
                padding: 48px 10px 10px !important;
                text-align: left;
            }

            .acoes-operacao-cell::before {
                top: 10px;
                width: auto;
            }

            .acoes-operacao button {
                min-width: 0;
                margin-bottom: 0 !important;
            }

            .acoes-operacao .btn-inativar-operacao {
                grid-column: auto;
            }

            .lista-loading-row td,
            .mensagem-tabela-operacoes td {
                display: block !important;
                padding: 14px !important;
                min-height: 0;
                text-align: left;
            }

            .lista-loading-row td::before,
            .mensagem-tabela-operacoes td::before {
                display: none;
            }

            .mensagem-tabela-operacoes td,
            .lista-loading-row td {
                text-align: center;
            }

            .menu-toggle {
                width: 34px !important;
                min-height: 34px !important;
                height: 34px !important;
                margin-bottom: 0 !important;
                padding: 0 !important;
                font-size: 26px !important;
                flex-shrink: 0;
            }

            .close-btn {
                width: 34px !important;
                min-height: 34px !important;
                height: 34px !important;
                margin-bottom: 0 !important;
                padding: 0 !important;
                font-size: 1.5rem !important;
                flex-shrink: 0;
            }

            .modal-actions,
            .avaliacoes-historico-header {
                flex-direction: column;
            }

            .avaliacoes-historico-header {
                align-items: flex-start;
            }

            .modal-actions button {
                width: 100%;
            }

            .modal-card {
                padding: 20px;
            }
        }

        @media (max-width: 380px) {
            .operacoes-list-actions {
                grid-template-columns: 1fr;
            }

            .operacoes-list-actions .cadastro-link,
            .operacoes-list-actions .btn-voltar-operacao {
                grid-column: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .growing-dots span {
                animation: none;
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
    <nav>
        <div class="logo">ORDENA</div>
        <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu" aria-expanded="false">☰</button>
    </nav>

    <div id="sidebar" class="sidebar"></div>
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <script src="../js/menu.js"></script>

    <main class="operacoes-page">
        <section class="card-container-main" aria-labelledby="tituloListaOperacoes">
            <div class="operacoes-list-header">
                <h2 id="tituloListaOperacoes">Operações Especiais Cadastradas</h2>

                <div class="operacoes-list-actions" role="navigation" aria-label="Navegação das operações especiais">
                    <button type="button" class="filter-btn cadastro-link" onclick="window.location.href='cadastro_operacao_especial.html'">Cadastrar</button>
                    <button type="button" onclick="mudarFiltro('Ativa')" id="btnFiltroAtiva" class="filter-btn active" aria-pressed="true">Ativas</button>
                    <button type="button" onclick="mudarFiltro('Inativa')" id="btnFiltroInativa" class="filter-btn filter-btn-inativa" aria-pressed="false">Inativas</button>
                    <button type="button" class="btn-voltar-operacao" onclick="window.location.href='index.html'">Home</button>
                </div>
            </div>

            <p style="margin: 8px 0 0 0; color: #666;">
                Consulte as operações cadastradas aqui ou pelo campo <strong>Vincular Operação</strong> da tela de OS.
            </p>

            <div id="listaOperacaoFeedback" class="operacao-feedback" aria-live="polite" tabindex="-1" style="margin-top: 18px;"></div>

            <div id="painelAlertasOperacoes" class="alertas-gerais"></div>

            <div class="table-responsive operacoes-table-wrapper">
                <table class="operacoes-table">
                    <thead>
                        <tr>
                            <th>Operação</th>
                            <th>Início</th>
                            <th>Término</th>
                            <th>OS vinculadas</th>
                            <th>Status</th>
                            <th>Avaliações</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaOperacoes" aria-live="polite">
                        <tr class="lista-loading-row">
                            <td colspan="7">
                                <div class="lista-loading" role="status">
                                    Carregando operações
                                    <span class="growing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modalInativarOperacao" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloModalInativacao" aria-describedby="nomeOperacaoInativacao descricaoInativacaoOperacao" hidden>
        <div class="modal-card modal-card-confirmacao">
            <h3 id="tituloModalInativacao">Inativar operação especial</h3>
            <p id="nomeOperacaoInativacao" class="modal-operation-name"></p>
            <div class="modal-divider"></div>

            <p id="descricaoInativacaoOperacao" class="modal-confirmacao-texto"></p>
            <div id="modalInativacaoMensagem" class="operacao-feedback" aria-live="polite"></div>

            <form id="inativarOperacaoForm">
                <div class="modal-actions">
                    <button type="button" id="btnCancelarInativacao" class="btn-secondary">Cancelar</button>
                    <button type="submit" id="btnConfirmarInativacao" class="btn-danger">Inativar operação</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Fluxo anterior de avaliações preservado apenas como referência. A interface ativa agora usa páginas separadas de listagem e cadastro.
    <div id="modalFeedbackOperacao" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloModalFeedback" aria-describedby="nomeOperacaoFeedback descricaoModalFeedback" hidden>
        <div class="modal-card">
            <h3 id="tituloModalFeedback" tabindex="-1">Avaliações da operação</h3>
            <p id="nomeOperacaoFeedback" class="modal-operation-name"></p>
            <div class="modal-divider"></div>

            <p id="descricaoModalFeedback" class="feedback-modal-description">
                Consulte as avaliações já registradas e adicione uma nova avaliação para a data desejada.
            </p>

            <div id="modalFeedbackMensagem" class="operacao-feedback" aria-live="polite" tabindex="-1"></div>

            <section class="avaliacoes-historico" aria-labelledby="tituloHistoricoAvaliacoes">
                <div class="avaliacoes-historico-header">
                    <h4 id="tituloHistoricoAvaliacoes">Histórico de avaliações</h4>
                </div>
                <div id="listaAvaliacoesOperacao" class="avaliacoes-lista" role="list" aria-live="polite">
                    <p class="avaliacoes-vazio">Nenhuma avaliação registrada.</p>
                </div>
            </section>

            <form id="feedbackOperacaoForm" novalidate>
                <h4 class="avaliacao-form-title">Cadastrar avaliação</h4>

                <div class="row">
                    <div class="col-1">
                        <label for="feedbackData">Data da avaliação <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
                        <input type="date" id="feedbackData" class="input-padrao" required aria-required="true">
                    </div>
                </div>

                <div class="row">
                    <div class="col-1">
                        <label for="feedbackTexto">Avaliação <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
                        <textarea id="feedbackTexto" class="input-padrao" maxlength="2000" placeholder="Registre a avaliação da operação." required aria-required="true"></textarea>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="btnCancelarFeedback" class="btn-secondary">Cancelar</button>
                    <button type="submit" id="btnSalvarFeedback" class="btn-success">Salvar avaliação</button>
                </div>
            </form>
        </div>
    </div>
    -->

    <script src="../js/operacoes_especiais.js"></script>
</body>
</html>
