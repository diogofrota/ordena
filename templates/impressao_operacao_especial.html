<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressão de Ordens da Operação Especial</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #eee;
            color: #333;
            font-family: "Segoe UI", Arial, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        #pdfContainer[hidden] {
            display: none !important;
        }

        .page {
            position: relative;
            display: flex;
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 10mm;
            flex-direction: column;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .page + .page {
            margin-top: 20px;
        }

        .page-os {
            break-before: page;
            page-break-before: always;
        }

        body.pdf-download-mode {
            padding: 0;
            background: #fff;
        }

        body.pdf-download-mode #pdfContainer {
            width: 210mm;
            margin: 0 auto;
        }

        body.pdf-download-mode .page {
            width: 210mm;
            margin: 0 auto 8mm;
            box-shadow: none;
        }

        .header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #1a237e;
            text-align: center;
        }

        .header-identidade {
            width: 100%;
            min-width: 0;
        }

        .header-instituicao {
            color: #1a237e;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.7px;
            line-height: 1.2;
            overflow-wrap: anywhere;
            text-transform: uppercase;
        }

        .header-orgao {
            margin-top: 3px;
            color: #555;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .document-title,
        .os-title {
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f4f6f9;
            color: #1a237e;
            font-size: 20px;
            font-weight: 700;
            overflow-wrap: anywhere;
            text-align: center;
            text-transform: uppercase;
        }

        .operation-name {
            margin: 0 0 10px;
            color: #1a237e;
            font-size: 24px;
            overflow-wrap: anywhere;
            text-align: center;
        }

        .operation-description {
            min-height: 52px;
            margin: 0 0 18px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fcfcfc;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .summary-grid,
        .os-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
        }

        .summary-item strong,
        .os-item strong {
            display: block;
            margin-bottom: 2px;
            color: #1a237e;
            font-size: 10px;
            text-transform: uppercase;
        }

        .summary-item span,
        .os-item span {
            font-size: 13px;
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .section-title {
            margin-bottom: 8px;
            padding-bottom: 3px;
            border-bottom: 1px solid #ccc;
            color: #1a237e;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            break-after: avoid;
        }

        table {
            width: 100%;
            margin-bottom: 18px;
            border-collapse: collapse;
            font-size: 11px;
        }

        th,
        td {
            padding: 6px;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #1a237e;
            color: #fff;
            font-size: 10px;
            text-transform: uppercase;
        }

        tr {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        tbody tr:nth-child(even) {
            background: #f9f9f9;
        }

        .td-wrap {
            min-height: 32px;
            overflow-wrap: anywhere;
        }

        .btn-gps {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 4px;
            background: #28a745;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }

        .prescricoes {
            min-height: 50px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fcfcfc;
            font-size: 11px;
            white-space: pre-wrap;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .card-ponto {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }

        .badge-tipo {
            padding: 2px 6px;
            border-radius: 4px;
            background: #1a237e;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-title {
            color: #333;
            font-size: 12px;
            font-weight: 700;
            overflow-wrap: anywhere;
            text-align: right;
        }

        .card-meta {
            color: #555;
            font-size: 10px;
            line-height: 1.45;
        }

        .card-map {
            width: 100%;
            height: 140px;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f0f0f0;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .map-message,
        .empty-maps {
            display: flex;
            min-height: 70px;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: #777;
            font-size: 11px;
            text-align: center;
        }

        .footer-info {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: auto;
            padding-top: 6px;
            border-top: 2px solid #1a237e;
            color: #444;
            font-size: 10px;
            break-inside: avoid;
        }

        .footer-right {
            font-weight: 700;
            text-align: right;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 3px;
            color: #fff;
            font-weight: 700;
        }

        .bg-ativa { background: #28a745; }
        .bg-inativa { background: #dc3545; }

        .report-toolbar {
            display: flex;
            width: min(210mm, 100%);
            margin: 0 auto 20px;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .report-status {
            display: flex;
            max-width: 100%;
            min-height: 42px;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid #b8c2cc;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
            color: #495057;
            font-size: 14px;
            font-weight: 600;
        }

        .report-status.success {
            border-color: #c3e6cb;
            background: #d4edda;
            color: #155724;
        }

        .report-status.warning {
            border-color: #ffeeba;
            background: #fff3cd;
            color: #856404;
        }

        .report-status.error {
            border-color: #f5c6cb;
            background: #f8d7da;
            color: #721c24;
        }

        .actions-print {
            display: flex;
            gap: 10px;
        }

        .btn-print {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border: 0;
            border-radius: 50px;
            background: #1a237e;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-print:hover:not(:disabled) {
            transform: scale(1.03);
            background: #283593;
        }

        .btn-download {
            background: #0d6efd;
        }

        .btn-download:hover:not(:disabled) {
            background: #0b5ed7;
        }

        .btn-print:disabled {
            cursor: not-allowed;
            opacity: 0.68;
        }

        .growing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 16px;
            margin-left: 8px;
        }

        .growing-dots[hidden] {
            display: none !important;
        }

        .growing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: report-dot-grow 1.2s infinite ease-in-out;
        }

        .growing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .growing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes report-dot-grow {
            0%, 60%, 100% { transform: scale(0.65); opacity: 0.45; }
            30% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 900px) {
            body {
                padding: 12px;
            }

            .report-toolbar {
                width: 100%;
                align-items: stretch;
                margin: 0 auto 14px;
            }

            .actions-print {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .page {
                width: 100%;
                min-height: 0;
            }
        }

        @media (max-width: 620px) {
            .summary-grid,
            .os-grid {
                grid-template-columns: 1fr;
            }

            .actions-print {
                grid-template-columns: 1fr;
            }

            .card-header,
            .footer-info {
                align-items: flex-start;
                flex-direction: column;
            }

            .card-title,
            .footer-right {
                text-align: left;
            }

            .page {
                padding: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .growing-dots span {
                animation: none;
                opacity: 1;
                transform: scale(1);
            }

            .btn-print {
                transition: none;
            }
        }

        @media print {
            @page {
                size: A4;
                margin: 10mm;
            }

            body {
                margin: 0;
                padding: 0;
                background: #fff;
            }

            .no-print {
                display: none !important;
            }

            .page {
                display: block;
                width: 100%;
                min-height: auto;
                margin: 0;
                padding: 0;
                box-shadow: none;
            }

            .page-os {
                break-before: page;
                page-break-before: always;
            }

            .document-title,
            .os-title {
                border: 1px solid #000;
                background: none;
                color: #000;
            }

            .header {
                border-bottom: 2px solid #000;
            }

            th {
                border-bottom: 1px solid #000;
                background: #eee !important;
                color: #000 !important;
            }

            .section-title {
                border-bottom: 1px solid #000;
                color: #000;
            }

            .card-ponto {
                border: 1px solid #000;
                background: #fff;
            }
        }
    </style>
</head>
<body>
    <div class="report-toolbar no-print" aria-label="Ações do relatório">
        <div id="statusRelatorio" class="report-status" role="status" aria-live="polite">
            <span id="textoStatusRelatorio">Carregando relatório</span>
            <span id="loadingStatusRelatorio" class="growing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>

        <div class="actions-print">
            <button type="button" id="btnBaixarPdf" class="btn-print btn-download" disabled>
                <span id="textoBtnBaixarPdf">⬇️ Baixar PDF</span>
                <span id="loadingBtnBaixarPdf" class="growing-dots" aria-hidden="true" hidden><span></span><span></span><span></span></span>
            </button>
            <button type="button" id="btnImprimirRelatorio" class="btn-print" disabled>
                <span id="textoBtnImprimirRelatorio">🖨️ Imprimir / Salvar PDF</span>
                <span id="loadingBtnImprimirRelatorio" class="growing-dots" aria-hidden="true" hidden><span></span><span></span><span></span></span>
            </button>
        </div>
    </div>

    <main id="pdfContainer" hidden></main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="../js/impressao_operacao_especial.js"></script>
    <script src="../js/cabecalho_impressao.js"></script>
</body>
</html>
