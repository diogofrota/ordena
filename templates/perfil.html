<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Meu Perfil</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .profile-page {
            max-width: 1000px;
        }

        .profile-card + .profile-card {
            margin-top: 30px;
        }

        .profile-description {
            color: #666;
            font-size: 0.95rem;
            margin: -6px 0 22px;
        }

        .input-locked {
            background-color: #e9ecef !important;
            color: #555 !important;
            cursor: not-allowed;
            font-weight: 600;
            border: 1px solid #ced4da;
            font-family: inherit;
        }

        .profile-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .profile-feedback {
            display: none;
            margin-bottom: 18px;
            padding: 12px 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .profile-feedback.is-visible {
            display: block;
        }

        .profile-feedback.success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .profile-feedback.error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .profile-page button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            filter: none;
        }

        @media (max-width: 768px) {
            .profile-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu" aria-expanded="false">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>
<script src="../js/menu.js"></script>

<main class="profile-page">
    <div id="perfilConteudo">
        <section class="card-container-main profile-card" aria-labelledby="tituloPerfil">
            <h2 id="tituloPerfil">Meu Perfil</h2>
            <p class="profile-description">Consulte seus dados pessoais e mantenha o telefone atualizado.</p>

            <div id="perfilFeedback" class="profile-feedback" aria-live="polite"></div>

            <form id="telefoneForm" novalidate>
                <div class="row">
                    <div class="col-1">
                        <label for="nomeCompleto">Nome completo</label>
                        <input type="text" id="nomeCompleto" class="input-padrao input-locked" value="Usuário de Demonstração" readonly>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" class="input-padrao input-locked" value="usuario.demo@ordena.local" readonly>
                    </div>
                    <div class="col-1">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" class="input-padrao" value="(00) 00000-0000" placeholder="(00) 00000-0000" maxlength="20" autocomplete="tel" aria-describedby="perfilFeedback" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2">
                        <label for="instituicaoPrefeitura">Instituição / Prefeitura</label>
                        <input type="text" id="instituicaoPrefeitura" class="input-padrao input-locked" value="Prefeitura Municipal de Demonstração" readonly>
                    </div>
                    <div class="col-1">
                        <label for="perfilAcesso">Perfil de acesso</label>
                        <input type="text" id="perfilAcesso" class="input-padrao input-locked" value="Admin" readonly>
                    </div>
                </div>

                <div class="row">
                    <div class="col-1">
                        <label for="orgaoBatalhao">Órgão ou batalhão</label>
                        <input type="text" id="orgaoBatalhao" class="input-padrao input-locked" value="Secretaria de Segurança Pública" readonly>
                    </div>
                </div>

                <div class="profile-actions">
                    <button type="submit" id="btnSalvarTelefone" class="btn-primary">Salvar telefone</button>
                </div>
            </form>
        </section>

        <section class="card-container-main profile-card" aria-labelledby="tituloAlterarSenha">
            <h2 id="tituloAlterarSenha">Alterar senha</h2>
            <p class="profile-description">Informe a senha atual e defina uma nova senha de acesso.</p>

            <div id="senhaFeedback" class="profile-feedback" aria-live="polite"></div>

            <form id="senhaForm" novalidate>
                <div class="row">
                    <div class="col-1">
                        <label for="senhaAtual">Senha atual</label>
                        <input type="password" id="senhaAtual" class="input-padrao" autocomplete="current-password" aria-describedby="senhaFeedback" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-1">
                        <label for="novaSenha">Nova senha</label>
                        <input type="password" id="novaSenha" class="input-padrao" autocomplete="new-password" aria-describedby="senhaFeedback" required>
                    </div>
                    <div class="col-1">
                        <label for="confirmarNovaSenha">Confirmar nova senha</label>
                        <input type="password" id="confirmarNovaSenha" class="input-padrao" autocomplete="new-password" aria-describedby="senhaFeedback" required>
                    </div>
                </div>

                <div class="profile-actions">
                    <button type="submit" id="btnAlterarSenha" class="btn-primary">Alterar senha</button>
                </div>
            </form>
        </section>
    </div>
</main>

<script src="../js/perfil.js"></script>
</body>
</html>
