<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Cadastro de Baseamento</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        #map { height: 450px; width: 100%; border-radius: 8px; border: 2px solid #ddd; z-index: 1; }
        .input-locked { background-color: #e9ecef !important; color: #555 !important; cursor: not-allowed; font-weight: 600; border: 1px solid #ced4da; font-family: inherit; }
        #codigoFinal { text-align: center; font-size: 1.2rem; color: #1a237e !important; letter-spacing: 1px; }
        .cadastro-form-header { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .cadastro-form-header h2 { margin: 0; }
        .cadastro-form-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; border: 1px solid #1a237e; background: white; color: #1a237e; cursor: pointer; border-radius: 20px; font-weight: 600; transition: all 0.3s; }
        .filter-btn.active { background: #1a237e; color: white; box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18); }
        .cadastro-link { border-color: #3f7f50; color: #3f7f50; }
        .cadastro-link.active { background: #3f7f50; border-color: #3f7f50; color: white; }
        .filter-btn-inativa { border-color: #a45f5f; color: #a45f5f; }
        .btn-voltar-baseamento { background: white; border: 1px solid #6c757d; border-radius: 20px; box-shadow: none; min-width: 84px; color: #6c757d; }
        .page-feedback { display: none; padding: 12px 15px; margin-bottom: 15px; border: 1px solid transparent; border-radius: 5px; font-weight: 600; }
        .page-feedback.is-visible { display: block; }
        .page-feedback.success { color: #155724; background: #d4edda; border-color: #c3e6cb; }
        .page-feedback.error { color: #721c24; background: #f8d7da; border-color: #f5c6cb; }
        #statusMapa { display: flex; min-height: 24px; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; color: #666; font-style: italic; text-align: center; }
        .map-loading-dots { display: inline-flex; align-items: center; gap: 4px; }
        .map-loading-dots[hidden] { display: none; }
        .map-loading-dots span { width: 7px; height: 7px; border-radius: 50%; background: #e65100; animation: map-dot-grow 1.2s infinite ease-in-out; }
        .map-loading-dots span:nth-child(2) { animation-delay: 0.15s; }
        .map-loading-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes map-dot-grow { 0%, 60%, 100% { transform: scale(0.65); opacity: 0.45; } 30% { transform: scale(1); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .map-loading-dots span { animation: none; transform: scale(1); opacity: 1; } }
        @media (max-width: 768px) {
            .cadastro-form-header { align-items: stretch; flex-direction: column; }
            .cadastro-form-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
            .cadastro-form-actions .cadastro-link, .cadastro-form-actions .btn-voltar-baseamento { grid-column: 1 / -1; }
            .cadastro-form-actions button { margin-bottom: 0 !important; }
            #map { height: 360px; }
        }
        @media (max-width: 380px) {
            .cadastro-form-actions { grid-template-columns: 1fr; }
            .cadastro-form-actions .cadastro-link, .cadastro-form-actions .btn-voltar-baseamento { grid-column: auto; }
            #map { height: 300px; }
        }

        /* Resumo compacto dos dados automáticos, preservando os campos do cadastro. */
        .cadastro-codigo { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .cadastro-codigo label { margin: 0; font-size: 0.82rem; color: #666; }
        .cadastro-codigo #codigoFinal { width: 80px; height: 26px; padding: 0; border: 0; border-radius: 0; background: transparent !important; text-align: left; font-size: 0.85rem; letter-spacing: 0; cursor: default; }
        .cadastro-endereco { margin: 18px 0; border-top: 1px solid #eee; }
        .cadastro-endereco-titulo { color: #1a237e; font-weight: 600; font-size: 0.9rem; margin: 14px 0 8px; }
        .cadastro-endereco-linha { display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid #eee; }
        .cadastro-endereco-linha label { flex: 0 0 110px; margin: 0; font-size: 0.82rem; color: #666; font-weight: 400; }
        .cadastro-endereco-linha .input-locked { min-width: 0; flex: 1; height: 24px; padding: 0; border: 0; border-radius: 0; background: transparent !important; font-size: 0.9rem; font-weight: 400; cursor: default; }
        .cadastro-endereco-linha .input-locked::placeholder { color: #888; opacity: 1; }
        @media (max-width: 380px) { .cadastro-endereco-linha { gap: 8px; } .cadastro-endereco-linha label { flex-basis: 95px; } }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu">☰</button>
</nav>
<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>
<script src="../js/menu.js"></script>
<main>
    <div class="card-container-main">
        <div class="cadastro-form-header">
            <h2>Cadastrar Novo Ponto de Interesse</h2>
            <div class="cadastro-form-actions" role="navigation" aria-label="Navegação do cadastro de baseamento">
                <button type="button" class="filter-btn cadastro-link active" aria-current="page">Cadastrar</button>
                <button type="button" class="filter-btn" onclick="window.location.href='enderecos.html?filtro=Ativo'">Ativos</button>
                <button type="button" class="filter-btn filter-btn-inativa" onclick="window.location.href='enderecos.html?filtro=Inativo'">Inativos</button>
                <button type="button" class="btn-voltar-baseamento" onclick="window.location.href='enderecos.html'">Voltar</button>
            </div>
        </div>
        <p style="color:#666; font-size:0.9rem; margin-bottom:20px;">Arraste o pino ou clique no mapa para preencher o endereço automaticamente.</p>
        <div id="feedbackEndereco" class="page-feedback" aria-live="polite"></div>
        <div class="row" style="align-items:flex-start;">
            <div class="col-1">
                <form id="formEndereco" style="height:100%; display:flex; flex-direction:column; justify-content:space-between;">
                    <input type="hidden" id="editIndex" value="-1">
                    <div>
                        <div class="cadastro-codigo"><label for="codigoFinal">Código do local:</label><input type="text" id="codigoFinal" class="input-padrao input-locked" readonly placeholder="..."></div>
                        <div style="margin-bottom:15px;"><label for="apelido">Apelido do Local (Identificação Tática)</label><input type="text" id="apelido" class="input-padrao" placeholder="Ex: Praça da Matriz" required maxlength="120"></div>
                        <div class="cadastro-endereco" role="group" aria-label="Endereço preenchido automaticamente pelo mapa">
                            <p class="cadastro-endereco-titulo">Endereço via GPS (Automático)</p>
                            <div class="cadastro-endereco-linha"><label for="nomeRua">Logradouro</label><input type="text" id="nomeRua" class="input-padrao input-locked" readonly placeholder="Selecione no mapa..."></div>
                            <div class="cadastro-endereco-linha"><label for="numero">Número (aprox.)</label><input type="text" id="numero" class="input-padrao input-locked" readonly placeholder="S/N"></div>
                            <div class="cadastro-endereco-linha"><label for="bairro">Bairro</label><input type="text" id="bairro" class="input-padrao input-locked" readonly placeholder="—"></div>
                            <div class="cadastro-endereco-linha"><label for="cidade">Cidade</label><input type="text" id="cidade" class="input-padrao input-locked" value="Rio de Janeiro" readonly></div>
                            <div class="cadastro-endereco-linha"><label for="estado">UF</label><input type="text" id="estado" class="input-padrao input-locked" value="RJ" readonly></div>
                        </div>
                        <div class="row" hidden style="display: none;">
                            <div class="col-1"><label for="latitude">Latitude</label><input type="hidden" id="latitude"></div>
                            <div class="col-1"><label for="longitude">Longitude</label><input type="hidden" id="longitude"></div>
                        </div>
                    </div>
                    <div class="row">
                        <button type="submit" id="btnSalvar" class="btn-primary" style="flex:1;">Salvar Localização</button>
                    </div>
                </form>
            </div>
            <div class="col-1">
                <label>Mapa de Cadastro</label>
                <div id="map" aria-label="Mapa para selecionar a localização do baseamento"></div>
                <small id="statusMapa" aria-live="polite">
                    <span id="statusMapaTexto">Arraste o pino ou clique no mapa para capturar o endereço.</span>
                    <span id="statusMapaLoading" class="map-loading-dots" hidden aria-hidden="true"><span></span><span></span><span></span></span>
                </small>
            </div>
        </div>
    </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="../js/enderecos.js"></script>
</body>
</html>
