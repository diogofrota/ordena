<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf }}">
    <title>ORDENA - Login</title>
    <link rel="icon" href="/assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/login.js" defer></script>
</head>
<body>
<nav><div class="logo">ORDENA</div></nav>
<main class="login-page">
    <section class="card-container-main">
        <h2>Acessar Ordena</h2>
        <p>Informe suas credenciais institucionais.</p>
        <div id="loginFeedback" role="status" aria-live="polite"></div>
        <form id="loginForm">
            <input type="hidden" name="next" value="{{ next_url }}">
            <label for="email">E-mail</label>
            <input class="input-padrao" id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
            <label for="senha">Senha</label>
            <input class="input-padrao" id="senha" name="senha" type="password" autocomplete="current-password" maxlength="128" required>
            <button class="btn-primary" type="submit">Entrar</button>
        </form>
        <p>O cadastro é realizado pela administração local.</p>
    </section>
</main>
</body>
</html>
