<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Avaliações da Operação</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .avaliacoes-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .avaliacoes-page-header h2 {
            margin: 0;
        }

        .avaliacoes-page-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            border-radius: 20px;
            background: #fff;
            color: #1a237e;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .cadastro-link {
            border-color: #3f7f50;
            color: #3f7f50;
        }

        .btn-voltar-operacao {
            border: 1px solid #6c757d;
            border-radius: 20px;
            background: #6c757d;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
            color: #fff;
        }

        .avaliacoes-page-description {
            margin: 0 0 20px;
            color: #666;
        }

        .avaliacoes-page-description strong {
            color: #1a237e;
            overflow-wrap: anywhere;
        }

        .operacao-feedback {
            display: none;
            margin-bottom: 18px;
            padding: 12px 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .operacao-feedback.is-visible {
            display: block;
        }

        .operacao-feedback.success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .operacao-feedback.error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .avaliacoes-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            color: #555;
            font-weight: 600;
        }

        .avaliacoes-loading[hidden],
        #avaliacoesOperacaoConteudo[hidden] {
            display: none !important;
        }

        .growing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 18px;
            margin-left: 8px;
        }

        .growing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            animation: operation-dot-grow 1.2s infinite ease-in-out;
        }

        .growing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .growing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes operation-dot-grow {
            0%, 60%, 100% { transform: scale(0.65); opacity: 0.45; }
            30% { transform: scale(1); opacity: 1; }
        }

        .avaliacoes-table {
            min-width: 760px;
        }

        .avaliacoes-table th:first-child,
        .avaliacoes-table td:first-child {
            width: 170px;
        }

        .avaliacoes-table th:last-child,
        .avaliacoes-table td:last-child {
            width: 230px;
        }

        .avaliacao-texto-cell {
            min-width: 300px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .avaliacao-registro-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-feedback-concluido {
            border: 1px solid #bee5eb;
            background: #d1ecf1;
            color: #0c5460;
            white-space: nowrap;
        }

        .avaliacoes-mensagem-row td {
            padding: 28px;
            color: #666;
            text-align: center;
        }

        .avaliacoes-page button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            filter: none;
        }

        @media (max-width: 768px) {
            .avaliacoes-page-header {
                align-items: stretch;
                flex-direction: column;
            }

            .avaliacoes-page-actions {
                display: grid;
                grid-template-columns: 1fr;
                width: 100%;
            }

            .avaliacoes-page-actions button {
                margin-bottom: 0 !important;
            }

            .avaliacoes-table {
                min-width: 0;
            }

            .avaliacoes-table td:first-child,
            .avaliacoes-table td:last-child {
                width: 100%;
            }

            .avaliacao-texto-cell {
                display: block !important;
                min-width: 0;
                padding: 48px 10px 12px !important;
                text-align: left;
            }

            .avaliacao-texto-cell::before {
                top: 10px;
                width: auto;
            }

            .avaliacao-registro-cell {
                justify-content: flex-end;
            }

            .avaliacoes-mensagem-row {
                padding: 0;
            }

            .avaliacoes-mensagem-row td {
                display: block !important;
                min-height: 0;
                padding: 24px 12px !important;
                text-align: center;
            }

            .avaliacoes-mensagem-row td::before {
                content: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .growing-dots span {
                animation: none;
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu" aria-expanded="false">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<script src="../js/menu.js"></script>

<main class="avaliacoes-page">
    <section class="card-container-main" aria-labelledby="tituloAvaliacoesOperacao">
        <div class="avaliacoes-page-header">
            <h2 id="tituloAvaliacoesOperacao">Avaliações da Operação</h2>

            <div class="avaliacoes-page-actions" role="navigation" aria-label="Navegação das avaliações da operação">
                <button type="button" id="btnCadastrarAvaliacao" class="filter-btn cadastro-link" disabled>Cadastrar</button>
                <button type="button" id="btnVoltarDetalhesAvaliacoes" class="btn-voltar-operacao" disabled>Voltar para operação</button>
            </div>
        </div>

        <p class="avaliacoes-page-description">
            Avaliações registradas para <strong id="nomeOperacaoAvaliacoes">a operação selecionada</strong>.
        </p>

        <div id="avaliacoesOperacaoFeedback" class="operacao-feedback" aria-live="polite" tabindex="-1"></div>

        <div id="avaliacoesOperacaoLoading" class="avaliacoes-loading" role="status" aria-live="polite">
            Carregando avaliações
            <span class="growing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>

        <div id="avaliacoesOperacaoConteudo" hidden>
            <div class="table-responsive">
                <table class="avaliacoes-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Avaliação</th>
                            <th>Registrada por</th>
                        </tr>
                    </thead>
                    <tbody id="listaAvaliacoesOperacaoTabela" aria-live="polite"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script src="../js/operacoes_especiais.js"></script>
</body>
</html>
