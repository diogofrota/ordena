<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Policiais</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            background: white;
            color: #1a237e;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #1a237e;
            color: white;
        }

        .cadastro-link {
            border-color: #3f7f50;
            color: #3f7f50;
        }

        .cadastro-link:hover,
        .cadastro-link:focus-visible {
            background: #3f7f50;
            color: white;
        }

        .filter-btn-inativa {
            border-color: #a45f5f;
            color: #a45f5f;
        }

        .filter-btn-inativa.active {
            background: #a45f5f;
            border-color: #a45f5f;
            color: white;
        }

        .policiais-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .policiais-list-header h2 {
            margin: 0;
        }

        .policiais-list-actions,
        .acoes-policial {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .policiais-table {
            min-width: 880px;
        }

        .policiais-table td {
            vertical-align: middle;
        }

        .acoes-policial button {
            min-width: 92px;
        }

        .page-feedback {
            display: none;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-weight: 600;
        }

        .page-feedback.is-visible {
            display: block;
        }

        .page-feedback.success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .page-feedback.error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .policiais-page button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            filter: none;
        }

        .growing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 18px;
            margin-left: 8px;
        }

        .growing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            animation: policial-dot-grow 1.2s infinite ease-in-out;
        }

        .growing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .growing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes policial-dot-grow {
            0%, 60%, 100% { transform: scale(0.65); opacity: 0.45; }
            30% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .policiais-table { min-width: 100%; }

            .policiais-list-header {
                align-items: stretch;
                flex-direction: column;
            }

            .policiais-list-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }

            .policiais-list-actions .cadastro-link {
                grid-column: 1 / -1;
            }

            .policiais-list-actions button,
            .acoes-policial button {
                margin-bottom: 0 !important;
            }

            td[data-label="Ações"] {
                padding-left: 10px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            td[data-label="Ações"]::before {
                position: static;
                width: 100%;
            }

            .acoes-policial {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }

            .acoes-policial button {
                width: 100% !important;
                min-width: 0;
            }
        }

        @media (max-width: 380px) {
            .policiais-list-actions,
            .acoes-policial {
                grid-template-columns: 1fr;
            }

            .policiais-list-actions .cadastro-link {
                grid-column: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .growing-dots span {
                animation: none;
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<script src="../js/menu.js"></script>

<main class="policiais-page">
    <section class="card-container-main" aria-labelledby="tituloListaPoliciais">
        <div class="policiais-list-header">
            <h2 id="tituloListaPoliciais">Policiais Cadastrados</h2>

            <div class="policiais-list-actions" role="navigation" aria-label="Navegação do cadastro de policiais">
                <button type="button" id="btnCadastrarPolicial" class="filter-btn cadastro-link">Cadastrar</button>
                <button type="button" id="btnFiltroAtivos" class="filter-btn active" aria-pressed="true">Ver Ativos</button>
                <button type="button" id="btnFiltroInativos" class="filter-btn filter-btn-inativa" aria-pressed="false">Ver Inativos</button>
            </div>
        </div>

        <div id="feedbackListaPoliciais" class="page-feedback" aria-live="polite"></div>

        <div id="tabelaPoliciaisContainer" class="table-responsive">
            <table class="policiais-table">
                <thead>
                    <tr>
                        <th>Posto/Grad</th>
                        <th>Nome de Guerra</th>
                        <th>RG</th>
                        <th>Telefone</th>
                        <th>Status</th>
                        <th style="text-align:center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPoliciais"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="../js/policiais.js"></script>
</body>
</html>
