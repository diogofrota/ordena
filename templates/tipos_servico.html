<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Tipos de Serviço</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            background: white;
            color: #1a237e;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #1a237e;
            color: white;
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18);
        }
        .cadastro-link {
            background-color: white;
            border-color: #3f7f50;
            border-radius: 20px;
            color: #3f7f50;
        }
        .filter-btn-inativa {
            border-color: #a45f5f;
            color: #a45f5f;
        }
        .filter-btn-inativa.active {
            background: #a45f5f;
            border-color: #a45f5f;
            color: white;
        }
        .btn-voltar-tipo-servico {
            background: white;
            border: 1px solid #6c757d;
            border-radius: 20px;
            box-shadow: none;
            color: #6c757d;
            min-width: 84px;
        }
        .cadastro-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .cadastro-list-header h2 {
            margin: 0;
        }
        .cadastro-list-actions,
        .acoes-tipo-servico {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-ativa { background: #d4edda; color: #155724; }
        .status-inativa { background: #f8d7da; color: #721c24; }
        .descricao-cell {
            white-space: normal;
            word-break: break-word;
            max-width: 420px;
        }
        .tipos-servico-empty-row td {
            padding: 24px 15px;
            text-align: center;
            color: #666;
        }

        @media (max-width: 768px) {
            .cadastro-list-header {
                align-items: stretch;
                flex-direction: column;
            }
            .cadastro-list-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }
            .cadastro-list-actions .cadastro-link,
            .cadastro-list-actions .btn-voltar-tipo-servico {
                grid-column: 1 / -1;
            }
            .cadastro-list-actions button,
            .acoes-tipo-servico button {
                margin-bottom: 0 !important;
            }
            .acoes-tipo-servico {
                display: grid;
                grid-template-columns: 1fr;
                width: 100%;
            }
            .tipos-servico-empty-row {
                padding: 0;
            }
            .tipos-servico-empty-row td {
                display: block;
                min-height: 0;
                padding: 24px 12px;
                text-align: center;
            }
            .tipos-servico-empty-row td::before {
                content: none;
            }
        }

        @media (max-width: 380px) {
            .cadastro-list-actions,
            .acoes-tipo-servico {
                grid-template-columns: 1fr;
            }
            .cadastro-list-actions .cadastro-link {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<script src="../js/menu.js"></script>

<main>
    <div class="card-container-main">
        <div class="cadastro-list-header">
            <h2>Tipos de Serviço Cadastrados</h2>

            <div class="cadastro-list-actions">
                <button type="button" class="filter-btn cadastro-link" onclick="window.location.href='cadastro_tipo_servico.html'">Cadastrar</button>
                <button type="button" onclick="mudarFiltro('Ativa')" id="btnFiltroAtiva" class="filter-btn active" aria-pressed="true">Ativos</button>
                <button type="button" onclick="mudarFiltro('Inativa')" id="btnFiltroInativa" class="filter-btn filter-btn-inativa" aria-pressed="false">Inativos</button>
                <button type="button" class="btn-voltar-tipo-servico" onclick="window.location.href='index.html'">Home</button>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Status</th>
                        <th style="text-align:center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaTiposServico"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="../js/tipos_servico.js"></script>
</body>
</html>
