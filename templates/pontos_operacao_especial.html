<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Pontos vinculados</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        .pontos-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .pontos-title-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            min-width: 0;
        }

        .pontos-title-area h2 {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .pontos-resumo-inline {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #666;
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .pontos-resumo-item {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
        }

        .pontos-resumo-item + .pontos-resumo-item {
            padding-left: 12px;
            border-left: 1px solid #d9dde1;
        }

        .pontos-resumo-item strong {
            color: #1a237e;
            font-size: 0.95rem;
        }

        .pontos-page-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            background: #fff;
            color: #1a237e;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .cadastro-link {
            border-color: #3f7f50;
            color: #3f7f50;
        }

        .filter-btn-inativa {
            border-color: #a45f5f;
            color: #a45f5f;
        }

        .btn-voltar-operacoes {
            background: #6c757d;
            border: 1px solid #6c757d;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
            color: #fff;
        }

        .pontos-page-description {
            margin: 0 0 20px;
            color: #666;
        }

        .pontos-feedback {
            display: none;
            margin-bottom: 18px;
            padding: 12px 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .pontos-feedback.is-visible {
            display: block;
        }

        .pontos-feedback.success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .pontos-feedback.error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .pontos-table-wrapper {
            margin-top: 22px;
        }

        .pontos-table {
            min-width: 1180px;
        }

        .texto-longo-ponto {
            min-width: 190px;
            overflow-wrap: anywhere;
        }

        .pontos-mensagem-row td {
            padding: 28px;
            color: #666;
            text-align: center;
        }

        .pontos-mensagem-row.erro td {
            color: #721c24;
            background: #f8d7da;
        }

        .pontos-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            color: #555;
            font-weight: 600;
        }

        .ponto-acoes-cell {
            min-width: 330px;
            text-align: center;
        }

        .ponto-acoes-grupo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .btn-acao-ponto {
            flex: 1 1 auto;
            width: auto;
            min-width: 88px;
            height: 36px;
            padding: 0 12px;
            white-space: nowrap;
        }

        .btn-acao-ponto:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            filter: none;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
        }

        .modal-overlay[hidden] {
            display: none !important;
        }

        .modal-card {
            width: 100%;
            max-width: 720px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding: 24px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .modal-card h3 {
            margin: 0 0 4px;
            color: #1a237e;
        }

        .modal-mapa-ponto-card {
            position: relative;
            max-width: 800px;
        }

        .modal-close-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            width: 44px;
            min-width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #333;
            font-size: 24px;
            font-weight: 700;
        }

        .mapa-ponto-descricao {
            margin: 5px 0 0;
            color: #666;
            font-size: 0.9rem;
        }

        #mapaPontoOperacao {
            width: 100%;
            height: 400px;
            margin-top: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f4f5f7;
            z-index: 1;
        }

        .mapa-ponto-status {
            display: flex;
            min-height: 24px;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: #666;
            font-size: 0.9rem;
        }

        .mapa-ponto-status.success { color: #155724; }
        .mapa-ponto-status.error { color: #721c24; }
        .mapa-ponto-status .growing-dots { margin-left: 0; }
        .mapa-ponto-status .growing-dots[hidden] { display: none; }

        body.modal-mapa-ponto-aberto {
            overflow: hidden;
        }

        .growing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 18px;
            margin-left: 8px;
        }

        .growing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            animation: operation-dot-grow 1.2s infinite ease-in-out;
        }

        .growing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .growing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes operation-dot-grow {
            0%, 60%, 100% { transform: scale(0.65); opacity: 0.45; }
            30% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .pontos-page-header {
                align-items: stretch;
                flex-direction: column;
            }

            .pontos-title-area {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }

            .pontos-page-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }

            .pontos-page-actions .cadastro-link {
                grid-column: 1 / -1;
            }

            .pontos-page-actions button {
                margin-bottom: 0 !important;
            }

            .pontos-table {
                min-width: 0;
            }

            .pontos-mensagem-row td,
            .pontos-loading-row td {
                display: block !important;
                min-height: 0;
                padding: 18px !important;
                text-align: center;
            }

            .pontos-mensagem-row td::before,
            .pontos-loading-row td::before {
                display: none;
            }

            .ponto-acoes-cell {
                align-items: stretch;
            }

            .ponto-acoes-grupo {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
                width: 100%;
            }

            .ponto-acoes-grupo .btn-acao-ponto {
                width: 100% !important;
                min-width: 0;
                margin-bottom: 0 !important;
            }

            .modal-overlay {
                padding: 10px;
            }

            .modal-mapa-ponto-card {
                max-height: calc(100vh - 20px);
                max-height: calc(100dvh - 20px);
                padding: 55px 15px 15px;
            }

            #mapaPontoOperacao {
                height: min(55vh, 360px);
            }

            .modal-close-btn {
                width: 44px !important;
                min-width: 44px !important;
                height: 44px !important;
                min-height: 44px !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }

        @media (max-width: 380px) {
            .pontos-resumo-inline {
                align-items: flex-start;
                flex-direction: column;
                gap: 2px;
                white-space: normal;
            }

            .pontos-resumo-item + .pontos-resumo-item {
                padding-left: 0;
                border-left: 0;
            }

            .pontos-page-actions {
                grid-template-columns: 1fr;
            }

            .pontos-page-actions .cadastro-link {
                grid-column: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .growing-dots span {
                animation: none;
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu" aria-expanded="false">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<script src="../js/menu.js"></script>

<main>
    <section class="card-container-main" aria-labelledby="tituloPontosOperacao">
        <div class="pontos-page-header">
            <div class="pontos-title-area">
                <h2 id="tituloPontosOperacao">Pontos vinculados à operação</h2>
                <div class="pontos-resumo-inline" aria-label="Resumo dos vínculos">
                    <span class="pontos-resumo-item">
                        <strong id="totalPontosVinculados">0</strong>
                        <span id="rotuloTotalPontosVinculados">pontos vinculados</span>
                    </span>
                    <span class="pontos-resumo-item">
                        <strong id="totalOsRelacionadas">0</strong>
                        <span id="rotuloTotalOsRelacionadas">OS relacionadas</span>
                    </span>
                </div>
            </div>
            <div class="pontos-page-actions" role="navigation" aria-label="Navegação dos pontos vinculados">
                <button type="button" id="btnCadastrarOperacao" class="filter-btn cadastro-link">Cadastrar</button>
                <button type="button" id="btnVerOperacoesInativas" class="filter-btn filter-btn-inativa">Ver Inativas</button>
                <button type="button" id="btnVoltarOperacoes" class="btn-voltar-operacoes">Voltar para operações</button>
            </div>
        </div>

        <p id="descricaoPontosOperacao" class="pontos-page-description">Carregando informações da operação...</p>
        <div id="pontosOperacaoFeedback" class="pontos-feedback" aria-live="polite"></div>

        <div class="table-responsive pontos-table-wrapper">
            <table class="pontos-table">
                <thead>
                    <tr>
                        <th scope="col">Nº OS</th>
                        <th scope="col">Missão</th>
                        <th scope="col">Atividade</th>
                        <th scope="col">Horário</th>
                        <th scope="col">Ponto / Área</th>
                        <th scope="col">Endereço</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPontosOperacao" aria-live="polite">
                    <tr class="pontos-loading-row">
                        <td colspan="7">
                            <div class="pontos-loading" role="status">
                                Carregando pontos vinculados
                                <span class="growing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div id="modalMapaPontoOperacao" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloMapaPontoOperacao" aria-describedby="descricaoMapaPontoOperacao" aria-hidden="true" hidden>
    <div class="modal-card modal-mapa-ponto-card">
        <button type="button" class="modal-close-btn" onclick="fecharMapaPontoOperacao()" aria-label="Fechar visualização do mapa">&times;</button>
        <h3 id="tituloMapaPontoOperacao" style="padding-right: 45px;">Visualização no mapa</h3>
        <p id="descricaoMapaPontoOperacao" class="mapa-ponto-descricao"></p>
        <div id="statusMapaPontoOperacao" class="mapa-ponto-status" role="status" aria-live="polite">
            <span id="statusMapaPontoOperacaoTexto">Carregando mapa...</span>
            <span id="statusMapaPontoOperacaoLoading" class="growing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>
        <div id="mapaPontoOperacao" role="region" aria-label="Mapa do ponto vinculado selecionado" aria-busy="false"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="../js/pontos_operacao_especial.js"></script>
</body>
</html>
