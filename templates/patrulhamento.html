<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Patrulhamento</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     
    <style>

        .patrol-feedback {
            display: none;
            margin-bottom: 18px;
            padding: 12px 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .patrol-feedback.is-visible { display: block; }
        .patrol-feedback.success { color: #155724; background: #d4edda; border-color: #c3e6cb; }
        .patrol-feedback.error { color: #721c24; background: #f8d7da; border-color: #f5c6cb; }


        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            background: white;
            color: #1a237e;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filter-btn.active { background: #1a237e; color: white; box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18); }

        .cadastro-link {
            background-color: white;
            border-color: #3f7f50;
            color: #3f7f50;
        }

        .cadastro-link:hover {
            background-color: white;
            color: #3f7f50;
            filter: none;
        }

        .btn-voltar-patrulhamento { background: white; border: 1px solid #6c757d; border-radius: 20px; box-shadow: none; color: #6c757d; min-width: 84px; }
        .filter-btn-inativa {
            border-color: #a45f5f;
            color: #a45f5f;
        }

        .filter-btn-inativa.active {
            background: #a45f5f;
            border-color: #a45f5f;
            color: white;
        }

        .cadastro-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .cadastro-list-header h2 { margin: 0; }

        .cadastro-list-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .acoes-patrulhamento {
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }
        
        .status-pill { padding: 4px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
        .status-ativa { background: #d4edda; color: #155724; }
        .status-inativa { background: #f8d7da; color: #721c24; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 800px; position: relative; }
        #mapaModal { height: 400px; width: 100%; border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; border: none; background: none; }
        
        /* Ajuste fino para alinhar texto da tabela */
        table td { vertical-align: middle; }

        @media (max-width: 768px) {
            .cadastro-list-header {
                align-items: stretch;
                flex-direction: column;
            }

            .cadastro-list-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }

            .cadastro-list-actions .cadastro-link { grid-column: 1 / -1; }
            .cadastro-list-actions .btn-voltar-patrulhamento { grid-column: 1 / -1; }

            .cadastro-list-actions button { margin-bottom: 0 !important; }

            .acoes-patrulhamento {
                align-items: stretch;
                flex-direction: column;
                gap: 8px;
                width: 55%;
                margin-left: auto;
            }

            .acoes-patrulhamento button {
                width: 100% !important;
                height: 48px !important;
                min-height: 48px !important;
                margin-bottom: 0 !important;
                padding: 0 8px !important;
                font-size: 0.9rem !important;
            }

            .modal-content { max-height: 90vh; overflow-y: auto; }
            #mapaModal { height: 320px; }
            .modal-content > .close-btn {
                width: 44px !important;
                height: 44px !important;
                min-height: 44px !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }

        @media (max-width: 380px) {
            .cadastro-list-actions { grid-template-columns: 1fr; }
            .cadastro-list-actions .cadastro-link { grid-column: auto; }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>
<script src="../js/menu.js"></script>

    <main>
        <div class="card-container-main">
            <div class="cadastro-list-header">
                <h2>Áreas Cadastradas</h2>
                <div class="cadastro-list-actions" role="navigation" aria-label="Navegação do cadastro de patrulhamento">
                    <button type="button" class="filter-btn cadastro-link" onclick="window.location.href='cadastro_patrulhamento.html'">Cadastrar</button>
                    <button type="button" onclick="mudarFiltro('Ativo')" id="btnFiltroAtiva" class="filter-btn active" aria-pressed="true">Ativas</button>
                    <button type="button" onclick="mudarFiltro('Inativo')" id="btnFiltroInativa" class="filter-btn filter-btn-inativa" aria-pressed="false">Inativas</button>
                    <button type="button" class="btn-voltar-patrulhamento" onclick="window.location.href='index.html'">Home</button>
                </div>
            </div>

            <div id="feedbackPatrulha" class="patrol-feedback" aria-live="polite"></div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Identificação</th>
                            <th>Polígono</th>
                            <th>Status</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaPatrulhamento"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modalVisualizacao" class="modal-overlay">
        <div class="modal-content">
            <button type="button" class="close-btn" onclick="fecharMapaModal()" aria-label="Fechar visualização da área">&times;</button>
            <h3 id="tituloModal" style="color: #1a237e; margin: 0;">Visualização de Área</h3>
            <p id="descModal" style="margin: 5px 0 0 0; color: #666; font-size: 0.9rem;"></p>
            <div id="mapaModal"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../js/patrulhamento.js"></script>
</body>
</html>
