<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Ordens de Serviço</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            background: white;
            color: #1a237e;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filter-btn.active { background: #1a237e; color: white; box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18); }
        .cadastro-link { background: white; border-color: #3f7f50; color: #3f7f50; }
        .cadastro-link:hover,
        .cadastro-link:focus-visible { background: white; color: #3f7f50; }
        .btn-voltar-os { background: white; border: 1px solid #6c757d; border-radius: 20px; box-shadow: none; color: #6c757d; min-width: 84px; }
        .filter-btn-inativa { border-color: #a45f5f; color: #a45f5f; }
        .filter-btn-inativa.active { background: #a45f5f; border-color: #a45f5f; color: white; }
        .os-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .os-list-header h2 { margin: 0; }
        .os-list-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }
        .acoes-os {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge-op-table {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 4px;
            background: #1565c0;
            color: white;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .page-feedback {
            display: none;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-weight: 600;
        }
        .page-feedback.is-visible { display: block; }
        .page-feedback.success { color: #155724; background: #d4edda; border-color: #c3e6cb; }
        .page-feedback.error { color: #721c24; background: #f8d7da; border-color: #f5c6cb; }
        .page-feedback.info { color: #0c5460; background: #d1ecf1; border-color: #bee5eb; }
        .os-empty-row td { padding: 24px 15px; text-align: center; color: #666; }

        @media (max-width: 768px) {
            .os-list-header { align-items: stretch; flex-direction: column; }
            .os-list-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }
            .os-list-actions .cadastro-link { grid-column: 1 / -1; }
            .os-list-actions .btn-voltar-os { grid-column: 1 / -1; }
            .os-list-actions button { margin-bottom: 0 !important; }
            td[data-label="Ações"] {
                padding-left: 10px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            td[data-label="Ações"]::before { position: static; width: 100%; }
            .acoes-os {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }
            .acoes-os button {
                width: 100% !important;
                min-width: 0;
                margin-bottom: 0 !important;
                padding: 0 10px !important;
            }
            .os-empty-row { padding: 0; }
            .os-empty-row td {
                display: block;
                min-height: 0;
                padding: 24px 12px;
                text-align: center;
            }
            .os-empty-row td::before { content: none; }
        }

        @media (max-width: 380px) {
            .os-list-actions,
            .acoes-os { grid-template-columns: 1fr; }
            .os-list-actions .cadastro-link { grid-column: auto; }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu" aria-expanded="false">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>
<script src="../js/menu.js"></script>

<main>
    <div class="card-container-main">
        <div class="os-list-header">
            <h2>Banco de Ordens de Serviço</h2>
            <div class="os-list-actions" role="navigation" aria-label="Navegação das ordens de serviço">
                <button type="button" class="filter-btn cadastro-link" onclick="window.location.href='cadastro_os.html'">Cadastrar</button>
                <button type="button" onclick="mudarFiltro('Ativa')" id="btnFiltroAtiva" class="filter-btn active" aria-pressed="true">Ativas</button>
                <button type="button" onclick="mudarFiltro('Inativa')" id="btnFiltroInativa" class="filter-btn filter-btn-inativa" aria-pressed="false">Inativas</button>
                <button type="button" class="btn-voltar-os" onclick="window.location.href='index.html'">Home</button>
            </div>
        </div>

        <div id="feedbackListaOS" class="page-feedback" aria-live="polite"></div>

        <div class="table-responsive">
            <table id="tabelaOSPrincipal">
                <thead>
                    <tr>
                        <th scope="col">Nº OS</th>
                        <th scope="col">Missão</th>
                        <th scope="col">Início</th>
                        <th scope="col">Término</th>
                        <th scope="col">Operação Especial</th>
                        <th scope="col" style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabelaOS"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="../js/os.js"></script>
</body>
</html>
