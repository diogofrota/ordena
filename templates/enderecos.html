<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Baseamento</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        .filter-btn { padding: 8px 16px; border: 1px solid #1a237e; background: white; color: #1a237e; cursor: pointer; border-radius: 20px; font-weight: 600; transition: all 0.3s; }
        .filter-btn.active { background: #1a237e; color: white; box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18); }
        .cadastro-link { background: white; border-color: #3f7f50; color: #3f7f50; }
        .cadastro-link:hover, .cadastro-link:focus-visible { background: white; color: #3f7f50; }
        .btn-voltar-baseamento { background: white; border: 1px solid #6c757d; border-radius: 20px; box-shadow: none; color: #6c757d; min-width: 84px; }
        .filter-btn-inativa { border-color: #a45f5f; color: #a45f5f; }
        .filter-btn-inativa.active { background: #a45f5f; border-color: #a45f5f; color: white; }
        .cadastro-list-header { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .cadastro-list-header h2 { margin: 0; }
        .cadastro-list-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
        .acoes-endereco { display: flex; justify-content: flex-end; gap: 5px; }
        .status-pill { padding: 4px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
        .status-ativa { background: #d4edda; color: #155724; }
        .status-inativa { background: #f8d7da; color: #721c24; }
        .page-feedback { display: none; padding: 12px 15px; margin-bottom: 15px; border: 1px solid transparent; border-radius: 5px; font-weight: 600; }
        .page-feedback.is-visible { display: block; }
        .page-feedback.success { color: #155724; background: #d4edda; border-color: #c3e6cb; }
        .page-feedback.error { color: #721c24; background: #f8d7da; border-color: #f5c6cb; }
        .modal-overlay { display: none; position: fixed; inset: 0; width: 100%; height: 100%; padding: 20px; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 800px; max-height: calc(100vh - 40px); overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; }
        #mapaModal { height: 400px; width: 100%; border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; }
        .modal-close-btn { position: absolute; top: 8px; right: 10px; width: 44px; min-width: 44px; height: 44px; padding: 0; font-size: 24px; font-weight: bold; color: #333; cursor: pointer; border: none; background: transparent; }
        @media (max-width: 768px) {
            .cadastro-list-header { align-items: stretch; flex-direction: column; }
            .cadastro-list-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
            .cadastro-list-actions .cadastro-link { grid-column: 1 / -1; }
            .cadastro-list-actions .btn-voltar-baseamento { grid-column: 1 / -1; }
            .cadastro-list-actions button, .modal-close-btn { margin-bottom: 0 !important; }
            td[data-label="Ações"] { padding-left: 10px; flex-direction: column; align-items: stretch; gap: 8px; }
            td[data-label="Ações"]::before { position: static; width: 100%; }
            .acoes-endereco { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
            .acoes-endereco button { width: 100% !important; min-width: 0; margin-bottom: 0 !important; padding: 0 12px !important; }
            .modal-overlay { padding: 10px; }
            .modal-content { width: 100%; max-height: calc(100vh - 20px); padding: 55px 15px 15px; }
            #mapaModal { height: min(55vh, 360px); }
            .modal-close-btn { width: 44px !important; min-width: 44px !important; height: 44px !important; min-height: 44px !important; padding: 0 !important; }
        }
        @media (max-width: 380px) {
            .cadastro-list-actions { grid-template-columns: 1fr; }
            .cadastro-list-actions .cadastro-link { grid-column: auto; }
            .acoes-endereco { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu">☰</button>
</nav>
<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>
<script src="../js/menu.js"></script>
<main>
    <div class="card-container-main">
        <div class="cadastro-list-header">
            <h2>Locais Cadastrados</h2>
            <div class="cadastro-list-actions" role="navigation" aria-label="Navegação do baseamento">
                <button type="button" class="filter-btn cadastro-link" onclick="window.location.href='cadastro_baseamento.html'">Cadastrar</button>
                <button type="button" onclick="mudarFiltro('Ativo')" id="btnFiltroAtiva" class="filter-btn active" aria-pressed="true">Ativos</button>
                <button type="button" onclick="mudarFiltro('Inativo')" id="btnFiltroInativa" class="filter-btn filter-btn-inativa" aria-pressed="false">Inativos</button>
                <button type="button" class="btn-voltar-baseamento" onclick="window.location.href='index.html'">Home</button>
            </div>
        </div>
        <div id="feedbackListaEnderecos" class="page-feedback" aria-live="polite"></div>
        <div class="table-responsive">
            <table>
                <thead><tr><th>Código</th><th>Apelido</th><th>Logradouro</th><th>Bairro</th><th>Município</th><th>GPS</th><th>Status</th><th style="text-align:center;">Ações</th></tr></thead>
                <tbody id="listaEnderecos"></tbody>
            </table>
        </div>
    </div>
</main>
<div id="modalVisualizacao" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-content">
        <button type="button" class="modal-close-btn" onclick="fecharMapaModal()" aria-label="Fechar visualização do mapa">&times;</button>
        <h3 id="tituloModal" style="color:#1a237e; margin:0; padding-right:45px;">Visualização de Local</h3>
        <p id="descModal" style="margin:5px 0 0; color:#666; font-size:0.9rem;"></p>
        <div id="mapaModal"></div>
    </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="../js/enderecos.js"></script>
</body>
</html>
