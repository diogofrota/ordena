<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Cadastro de Policial</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .cadastro-form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .cadastro-form-header h2 {
            margin: 0;
        }

        .cadastro-form-actions,
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            background: white;
            color: #1a237e;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #1a237e;
            color: white;
        }

        .cadastro-form-actions button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .cadastro-link {
            border-color: #3f7f50;
            color: #3f7f50;
        }

        .cadastro-link.active {
            background: #3f7f50;
            border-color: #3f7f50;
            color: white;
        }

        .filter-btn-inativa {
            border-color: #a45f5f;
            color: #a45f5f;
        }

        .btn-voltar-policiais {
            background: #6c757d;
            border: 1px solid #6c757d;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
            color: white;
        }

        .form-description {
            color: #666;
            font-size: 0.95rem;
            margin: -6px 0 22px;
        }

        .campo-obrigatorio {
            color: #d32f2f;
        }

        .field-help {
            display: block;
            margin-top: 5px;
            color: #777;
            font-size: 0.82rem;
        }

        .page-feedback {
            display: none;
            padding: 12px 15px;
            margin-bottom: 18px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-weight: 600;
        }

        .page-feedback.is-visible {
            display: block;
        }

        .page-feedback.success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .page-feedback.error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .policiais-page button:disabled,
        .policiais-page .input-padrao:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            filter: none;
        }

        #btnCancelarEdicaoPolicial[hidden] {
            display: none !important;
        }

        .growing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 18px;
            margin-left: 8px;
        }

        .growing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            animation: policial-dot-grow 1.2s infinite ease-in-out;
        }

        .growing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .growing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes policial-dot-grow {
            0%, 60%, 100% { transform: scale(0.65); opacity: 0.45; }
            30% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .cadastro-form-header {
                align-items: stretch;
                flex-direction: column;
            }

            .cadastro-form-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }

            .cadastro-form-actions .cadastro-link,
            .cadastro-form-actions .btn-voltar-policiais {
                grid-column: 1 / -1;
            }

            .cadastro-form-actions button,
            .form-actions button {
                margin-bottom: 0 !important;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions button {
                width: 100%;
            }
        }

        @media (max-width: 380px) {
            .cadastro-form-actions {
                grid-template-columns: 1fr;
            }

            .cadastro-form-actions .cadastro-link,
            .cadastro-form-actions .btn-voltar-policiais {
                grid-column: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .growing-dots span {
                animation: none;
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<script src="../js/menu.js"></script>

<main class="policiais-page">
    <section class="card-container-main" aria-labelledby="tituloCadastroPolicial">
        <div class="cadastro-form-header">
            <h2 id="tituloCadastroPolicial">Cadastrar Novo Policial</h2>

            <div class="cadastro-form-actions" role="navigation" aria-label="Navegação do cadastro de policiais">
                <button type="button" class="filter-btn cadastro-link active" aria-current="page">Cadastrar</button>
                <button type="button" class="filter-btn" onclick="window.location.href='policiais.html?filtro=Ativo'">Ver Ativos</button>
                <button type="button" class="filter-btn filter-btn-inativa" onclick="window.location.href='policiais.html?filtro=Inativo'">Ver Inativos</button>
                <button type="button" class="btn-voltar-policiais" onclick="window.location.href='policiais.html'">Voltar</button>
            </div>
        </div>

        <p id="descricaoCadastroPolicial" class="form-description">
            Cadastre os dados do policial para utilizá-lo na composição das guarnições.
        </p>

        <div id="feedbackCadastroPolicial" class="page-feedback" aria-live="polite"></div>

        <form id="policialForm" novalidate>
            <div class="row">
                <div class="col-1">
                    <label for="postoPolicial">Posto/Graduação <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
                    <select id="postoPolicial" class="input-padrao" required aria-required="true">
                        <option value="">Selecione...</option>
                        <option value="GCM Coordenador">GCM Coordenador</option>
                        <option value="GCM Supervisor">GCM Supervisor</option>
                        <option value="GCM">GCM</option>
                        <option value="SD">SD</option>
                        <option value="CB">CB</option>
                        <option value="3SGT">3 SGT</option>
                        <option value="2SGT">2 SGT</option>
                        <option value="1SGT">1 SGT</option>
                        <option value="SUBTEN">SUBTEN</option>
                        <option value="ASP">ASP</option>
                        <option value="TEN">TEN</option>
                        <option value="CAP">CAP</option>
                        <option value="MAJ">MAJ</option>
                        <option value="TC">TC</option>
                        <option value="CEL">CEL</option>
                    </select>
                </div>

                <div class="col-2">
                    <label for="nomeGuerraPolicial">Nome de Guerra <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
                    <input type="text" id="nomeGuerraPolicial" class="input-padrao" maxlength="80" placeholder="Ex: SILVA" autocomplete="off" required aria-required="true">
                </div>
            </div>

            <div class="row">
                <div class="col-1">
                    <label for="rgPolicial">RG <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
                    <input type="text" id="rgPolicial" class="input-padrao" maxlength="20" placeholder="Ex: 00.000" autocomplete="off" required aria-required="true" aria-describedby="ajudaRgPolicial">
                    <small id="ajudaRgPolicial" class="field-help">O RG não pode estar vinculado a outro cadastro, mesmo inativo.</small>
                </div>

                <div class="col-1">
                    <label for="telefonePolicial">Telefone <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
                    <input type="tel" id="telefonePolicial" class="input-padrao" maxlength="15" placeholder="(21) 90000-0000" autocomplete="tel" inputmode="numeric" required aria-required="true" aria-describedby="ajudaTelefonePolicial">
                    <small id="ajudaTelefonePolicial" class="field-help">Informe DDD e telefone com 10 ou 11 dígitos.</small>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" id="btnSalvarPolicial" class="btn-primary">Salvar policial</button>
                <button type="button" id="btnCancelarEdicaoPolicial" class="btn-secondary" hidden>Cancelar edição</button>
            </div>
        </form>
    </section>
</main>

<script src="../js/policiais.js"></script>
</body>
</html>
