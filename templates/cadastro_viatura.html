<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Cadastro de Viatura</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .cadastro-form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .cadastro-form-header h2 {
            margin: 0;
        }
        .cadastro-viatura-row {
            flex-wrap: wrap;
        }
        .cadastro-viatura-row .col-1 {
            flex: 1 1 150px;
        }
        .cadastro-form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            background: white;
            color: #1a237e;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #1a237e;
            color: white;
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18);
        }
        .cadastro-link {
            border-color: #3f7f50;
            color: #3f7f50;
        }
        .cadastro-link.active {
            background: #3f7f50;
            border-color: #3f7f50;
            color: white;
        }
        .filter-btn-inativa {
            border-color: #a45f5f;
            color: #a45f5f;
        }
        .btn-voltar-viatura {
            background: white;
            border: 1px solid #6c757d;
            border-radius: 20px;
            box-shadow: none;
            color: #6c757d;
            min-width: 84px;
        }

        @media (max-width: 768px) {
            .cadastro-form-header {
                align-items: stretch;
                flex-direction: column;
            }
            .cadastro-form-header button {
                margin-bottom: 0 !important;
            }
            .cadastro-viatura-row .col-1 {
                flex: 0 0 auto;
            }
            .cadastro-form-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
            }
            .cadastro-form-actions .cadastro-link {
                grid-column: 1 / -1;
            }
            .cadastro-form-actions .btn-voltar-viatura {
                grid-column: 1 / -1;
            }
            .cadastro-form-actions button {
                margin-bottom: 0 !important;
            }
        }

        @media (max-width: 380px) {
            .cadastro-form-actions {
                grid-template-columns: 1fr;
            }
            .cadastro-form-actions .cadastro-link {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">
        ORDENA
    </div>

    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu">
        ☰
    </button>
</nav>

<div id="sidebar" class="sidebar"></div>

<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<script src="../js/menu.js"></script>

    <main>
        <div class="card-container-main">
            <div class="cadastro-form-header">
                <h2>Cadastrar Nova Viatura</h2>
                <div class="cadastro-form-actions" role="navigation" aria-label="Navegação do cadastro de viaturas">
                    <button type="button" class="filter-btn cadastro-link active" aria-current="page">Cadastrar</button>
                    <button type="button" class="filter-btn" onclick="window.location.href='cadastro.html?filtro=Ativa'">Ativas</button>
                    <button type="button" class="filter-btn filter-btn-inativa" onclick="window.location.href='cadastro.html?filtro=Inativa'">Baixadas</button>
                    <button type="button" class="btn-voltar-viatura" onclick="window.location.href='cadastro.html'">Voltar</button>
                </div>
            </div>

            <form id="viaturaForm">
                <div class="row cadastro-viatura-row" style="align-items: flex-end; margin-bottom: 0;">
                    <div class="col-1">
                        <label for="tipoVeiculo">Tipo de Veículo</label>
                        <select id="tipoVeiculo" class="input-padrao" required>
                            <option value="">Selecione...</option>
                            <option value="Carro">Carro</option>
                            <option value="Moto">Moto</option>
                        </select>
                    </div>

                    <div class="col-1">
                        <label for="modelo">Modelo</label>
                        <select id="modelo" class="input-padrao" required disabled aria-disabled="true">
                            <option value="">Selecione...</option>
                            <option value="Mini">Mini</option>
                            <option value="Passeio">Passeio</option>
                            <option value="SUV">SUV</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="col-1">
                        <label for="prefixo">Prefixo Operacional</label>
                        <input type="text" id="prefixo" class="input-padrao" placeholder="Ex: 80-1234" required>
                    </div>
                    <div class="col-1">
                        <label for="placa">Placa Oficial</label>
                        <input type="text" id="placa" class="input-padrao" placeholder="ABC-1234" required>
                    </div>
                    <div class="col-1">
                        <label for="radio">Identificador Rádio</label>
                        <input type="text" id="radio" class="input-padrao" placeholder="Opcional" title="Use o identificador retornado pela API GPS para monitorar esta viatura.">
                    </div>

                    <div class="col-1">
                        <button type="submit" id="btnSalvar" class="btn-primary" style="width: 100%;">Salvar Registro</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
