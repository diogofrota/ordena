<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Detalhes da Operação Especial</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        .detalhes-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .detalhes-page-header h2 {
            margin: 0;
        }

        .detalhes-page-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-avaliacoes-detalhes {
            padding: 0 20px;
            border: 1px solid #1a237e;
            border-radius: 20px;
            background: #fff;
            color: #1a237e;
        }

        .btn-imprimir-os-operacao {
            padding: 0 20px;
            border: 1px solid #1a237e;
            border-radius: 20px;
            background: #1a237e;
            color: #fff;
        }

        .btn-voltar-operacoes {
            background: #6c757d;
            border: 1px solid #6c757d;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
            color: #fff;
        }

        .detalhes-page-description {
            color: #666;
            margin: 0 0 22px;
        }

        .operacao-feedback {
            display: none;
            margin-bottom: 18px;
            padding: 12px 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .operacao-feedback.is-visible {
            display: block;
        }

        .operacao-feedback.success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .operacao-feedback.error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .lista-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            color: #555;
            font-weight: 600;
        }

        .lista-loading[hidden],
        #detalhesOperacaoConteudo[hidden] {
            display: none !important;
        }

        .growing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 18px;
            margin-left: 8px;
        }

        .growing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            animation: operation-dot-grow 1.2s infinite ease-in-out;
        }

        .growing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .growing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes operation-dot-grow {
            0%, 60%, 100% { transform: scale(0.65); opacity: 0.45; }
            30% { transform: scale(1); opacity: 1; }
        }

        .detalhes-op {
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .detalhes-operacao-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 18px;
        }

        .detalhes-operacao-label {
            display: block;
            margin-bottom: 3px;
            color: #666;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .detalhes-operacao-header h3 {
            margin: 0;
            color: #1a237e;
            font-size: 1.45rem;
            overflow-wrap: anywhere;
        }

        .detalhes-operacao-status {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-ativa {
            background: #d4edda;
            color: #155724;
        }

        .status-inativa {
            background: #f8d7da;
            color: #721c24;
        }

        .status-warning,
        .status-feedback-pendente {
            background: #fff3cd;
            color: #8a5600;
            border: 1px solid #f4d58a;
        }

        .status-feedback-concluido {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .alerta-op {
            margin-bottom: 14px;
            padding: 12px;
            border: 1px solid #f4d58a;
            border-radius: 6px;
            background: #fff7dc;
            color: #6e4900;
            font-size: 0.9rem;
        }

        .descricao-op {
            margin-bottom: 16px;
            padding: 14px;
            border-radius: 6px;
            background: #f8f9fa;
            color: #333;
        }

        .descricao-op strong {
            display: block;
            margin-bottom: 5px;
            color: #1a237e;
        }

        .descricao-op p {
            margin: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .meta-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 0;
            padding: 12px 0;
            border-top: 1px solid #e9ecef;
            border-bottom: 1px solid #e9ecef;
        }

        .meta-item {
            flex: 1 1 auto;
            min-width: 0;
            padding: 0 12px;
            border-left: 1px solid #d9dde1;
            background: #fff;
        }

        .meta-item:first-child {
            border-left: 0;
        }

        .meta-item-wide {
            flex-basis: 160px;
        }

        .meta-item span {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .meta-item strong {
            display: block;
            color: #222;
            font-size: 0.92rem;
            overflow-wrap: anywhere;
        }

        .detalhes-registro {
            display: flex;
            gap: 8px 20px;
            flex-wrap: wrap;
            margin-top: 14px;
            color: #777;
            font-size: 0.82rem;
        }

        .pontos-detalhes-section {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid #eee;
        }

        .pontos-detalhes-header,
        .pontos-title-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .pontos-detalhes-header {
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .pontos-title-area h4 {
            margin: 0;
            color: #1a237e;
            font-size: 1.05rem;
            overflow-wrap: anywhere;
        }

        .pontos-resumo-inline {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #666;
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .pontos-resumo-item {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
        }

        .pontos-resumo-item + .pontos-resumo-item {
            padding-left: 12px;
            border-left: 1px solid #d9dde1;
        }

        .pontos-resumo-item strong {
            color: #1a237e;
            font-size: 0.95rem;
        }

        .pontos-page-description {
            margin: 0 0 16px;
            color: #666;
        }

        .pontos-feedback {
            display: none;
            margin-bottom: 16px;
            padding: 12px 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .pontos-feedback.is-visible {
            display: block;
        }

        .pontos-feedback.success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .pontos-feedback.error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .pontos-table-wrapper {
            margin-top: 16px;
        }

        .pontos-table {
            min-width: 1100px;
        }

        .avaliacoes-detalhes-table th:first-child,
        .avaliacoes-detalhes-table td:first-child {
            width: 170px;
        }

        .avaliacoes-detalhes-table th:last-child,
        .avaliacoes-detalhes-table td:last-child {
            width: 230px;
        }

        .avaliacao-texto-cell {
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .avaliacoes-detalhes-table .fracionamento-editor td {
            background: #f8f9fa;
            vertical-align: middle;
            white-space: normal;
        }

        .avaliacoes-detalhes-table .input-padrao {
            width: 100%;
            margin-bottom: 0;
        }

        .avaliacoes-detalhes-table textarea {
            display: block;
            min-height: 64px;
            resize: vertical;
        }

        .avaliacoes-detalhes-table button {
            margin-bottom: 0;
            white-space: nowrap;
        }

        .avaliacoes-mensagem-row td {
            padding: 28px;
            color: #666;
            text-align: center;
        }

        .texto-longo-ponto {
            min-width: 190px;
            overflow-wrap: anywhere;
        }

        .pontos-mensagem-row td {
            padding: 28px;
            color: #666;
            text-align: center;
        }

        .pontos-mensagem-row.erro td {
            color: #721c24;
            background: #f8d7da;
        }

        .pontos-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            color: #555;
            font-weight: 600;
        }

        .ponto-acoes-cell {
            min-width: 270px;
            text-align: center;
        }

        .ponto-acoes-grupo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: nowrap;
        }

        .btn-acao-ponto {
            height: 36px;
            padding: 0 10px;
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .btn-mapa-ponto {
            min-width: 82px;
        }


        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
        }

        .modal-overlay[hidden] {
            display: none !important;
        }

        .modal-card {
            width: 100%;
            max-width: 720px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding: 24px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .modal-card h3 {
            margin: 0 0 4px;
            color: #1a237e;
        }

        .modal-mapa-ponto-card {
            position: relative;
            max-width: 800px;
        }

        .modal-close-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            width: 44px;
            min-width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #333;
            font-size: 24px;
            font-weight: 700;
        }

        .mapa-ponto-descricao {
            margin: 5px 0 0;
            color: #666;
            font-size: 0.9rem;
        }

        #mapaPontoOperacao {
            width: 100%;
            height: 400px;
            margin-top: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f4f5f7;
            z-index: 1;
        }

        .mapa-ponto-status {
            display: flex;
            min-height: 24px;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: #666;
            font-size: 0.9rem;
        }

        .mapa-ponto-status.success { color: #155724; }
        .mapa-ponto-status.error { color: #721c24; }
        .mapa-ponto-status .growing-dots { margin-left: 0; }
        .mapa-ponto-status .growing-dots[hidden] { display: none; }

        body.modal-mapa-ponto-aberto {
            overflow: hidden;
        }

        .operacoes-page button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            filter: none;
        }

        @media (max-width: 860px) {
            .meta-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .meta-item:nth-child(odd) {
                border-left: 0;
            }

            .meta-item span {
                white-space: normal;
            }

            .meta-item-wide {
                grid-column: 1 / -1;
                border-left: 0;
            }
        }

        @media (max-width: 768px) {
            .avaliacoes-detalhes-table td:first-child,
            .avaliacoes-detalhes-table td:last-child {
                width: auto;
            }

            .avaliacoes-detalhes-table .avaliacao-texto-cell,
            .avaliacoes-detalhes-table .fracionamento-editor td {
                display: block;
                padding: 34px 10px 10px;
                text-align: left;
            }

            .avaliacoes-detalhes-table .avaliacao-texto-cell::before,
            .avaliacoes-detalhes-table .fracionamento-editor td::before {
                top: 10px;
                width: auto;
            }

            .avaliacoes-mensagem-row td {
                display: block;
                padding: 18px;
                text-align: center;
            }

            .avaliacoes-mensagem-row td::before {
                content: none;
            }

            .detalhes-page-header,
            .detalhes-operacao-header,
            .pontos-detalhes-header,
            .pontos-title-area {
                align-items: stretch;
                flex-direction: column;
            }

            .pontos-title-area {
                align-items: flex-start;
                gap: 6px;
            }

            .pontos-table {
                min-width: 0;
            }

            .pontos-mensagem-row td,
            .pontos-loading-row td {
                display: block !important;
                min-height: 0;
                padding: 18px !important;
                text-align: center;
            }

            .pontos-mensagem-row td::before,
            .pontos-loading-row td::before {
                display: none;
            }

            .ponto-acoes-grupo {
                display: grid;
                grid-template-columns: 1fr;
            }

            .ponto-acoes-grupo .btn-acao-ponto {
                width: 100%;
                margin-bottom: 0 !important;
            }

            .modal-overlay {
                padding: 10px;
            }

            .detalhes-operacao-status {
                justify-content: flex-start;
            }

            .detalhes-page-actions {
                display: grid;
                grid-template-columns: 1fr;
                width: 100%;
            }

            .detalhes-page-actions button,
            .btn-voltar-operacoes {
                margin-bottom: 0 !important;
            }

            .modal-card {
                padding: 20px;
            }

            .modal-mapa-ponto-card {
                max-height: calc(100vh - 20px);
                max-height: calc(100dvh - 20px);
                padding: 55px 15px 15px;
            }

            #mapaPontoOperacao {
                height: min(55vh, 360px);
            }

            .modal-close-btn {
                width: 44px !important;
                min-width: 44px !important;
                height: 44px !important;
                min-height: 44px !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }

        @media (max-width: 380px) {
            .pontos-resumo-inline {
                align-items: flex-start;
                flex-direction: column;
                gap: 2px;
                white-space: normal;
            }

            .pontos-resumo-item + .pontos-resumo-item {
                padding-left: 0;
                border-left: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .growing-dots span {
                animation: none;
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu" aria-expanded="false">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<script src="../js/menu.js"></script>

<main class="operacoes-page">
    <section class="card-container-main" aria-labelledby="tituloDetalhesOperacao">
        <div class="detalhes-page-header">
            <h2 id="tituloDetalhesOperacao">Detalhes da Operação Especial</h2>
            <div class="detalhes-page-actions" role="navigation" aria-label="Navegação dos detalhes da operação">
                <!-- Avaliações integradas abaixo dos pontos vinculados.
                <button type="button" id="btnAvaliacoesDetalhesOperacao" class="btn-avaliacoes-detalhes" disabled>Avaliações</button>
                -->
                <button type="button" id="btnImprimirTodasOSOperacao" class="btn-imprimir-os-operacao" disabled>Imprimir todas as OS</button>
                <button type="button" id="btnVoltarDetalhesOperacao" class="btn-voltar-operacoes">Voltar para operações</button>
            </div>
        </div>

        <p class="detalhes-page-description">Consulte os dados do cadastro e os pontos vinculados em Ordens de Serviço ativas.</p>

        <div id="detalhesOperacaoFeedback" class="operacao-feedback" aria-live="polite"></div>

        <div id="detalhesOperacaoLoading" class="lista-loading" role="status" aria-live="polite">
            Carregando detalhes
            <span class="growing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>

        <div id="detalhesOperacaoConteudo" class="detalhes-op" hidden></div>
    </section>
</main>

<div id="modalMapaPontoOperacao" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloMapaPontoOperacao" aria-describedby="descricaoMapaPontoOperacao" aria-hidden="true" hidden>
    <div class="modal-card modal-mapa-ponto-card">
        <button type="button" class="modal-close-btn" onclick="fecharMapaPontoOperacao()" aria-label="Fechar visualização do mapa">&times;</button>
        <h3 id="tituloMapaPontoOperacao" style="padding-right: 45px;">Visualização no mapa</h3>
        <p id="descricaoMapaPontoOperacao" class="mapa-ponto-descricao"></p>
        <div id="statusMapaPontoOperacao" class="mapa-ponto-status" role="status" aria-live="polite">
            <span id="statusMapaPontoOperacaoTexto">Carregando mapa...</span>
            <span id="statusMapaPontoOperacaoLoading" class="growing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>
        <div id="mapaPontoOperacao" role="region" aria-label="Mapa do ponto vinculado selecionado" aria-busy="false"></div>
    </div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="../js/pontos_operacao_especial.js"></script>
<script src="../js/operacoes_especiais.js"></script>
</body>
</html>
