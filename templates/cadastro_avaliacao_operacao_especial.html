<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDENA - Cadastrar Avaliação</title>
    <link rel="icon" href="../assets/images/ordenar.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .cadastro-avaliacao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .cadastro-avaliacao-header h2 {
            margin: 0;
        }

        .cadastro-avaliacao-actions,
        .avaliacao-submit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #1a237e;
            border-radius: 20px;
            background: #fff;
            color: #1a237e;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .cadastro-link {
            border-color: #3f7f50;
            color: #3f7f50;
        }

        .cadastro-link.active {
            border-color: #3f7f50;
            background: #3f7f50;
            color: #fff;
        }

        .btn-voltar-operacao {
            border: 1px solid #6c757d;
            border-radius: 20px;
            background: #6c757d;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.14);
            color: #fff;
        }

        .cadastro-avaliacao-description {
            margin: 0 0 20px;
            color: #666;
        }

        .cadastro-avaliacao-description strong {
            color: #1a237e;
            overflow-wrap: anywhere;
        }

        .operacao-feedback {
            display: none;
            margin-bottom: 18px;
            padding: 12px 15px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .operacao-feedback.is-visible {
            display: block;
        }

        .operacao-feedback.success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .operacao-feedback.error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .cadastro-avaliacao-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            color: #555;
            font-weight: 600;
        }

        .cadastro-avaliacao-loading[hidden],
        #cadastroAvaliacaoOperacaoConteudo[hidden] {
            display: none !important;
        }

        .growing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 18px;
            margin-left: 8px;
        }

        .growing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            animation: operation-dot-grow 1.2s infinite ease-in-out;
        }

        .growing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .growing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes operation-dot-grow {
            0%, 60%, 100% { transform: scale(0.65); opacity: 0.45; }
            30% { transform: scale(1); opacity: 1; }
        }

        .campo-obrigatorio {
            color: #d32f2f;
        }

        .avaliacao-data-row {
            max-width: 340px;
        }

        textarea.input-padrao {
            min-height: 120px;
            height: auto;
            resize: vertical;
            font-family: inherit;
        }

        .avaliacao-submit-actions {
            margin-top: 4px;
        }

        .avaliacao-submit-actions .btn-success {
            min-width: 180px;
        }

        .cadastro-avaliacao-page button:disabled,
        .cadastro-avaliacao-page input:disabled,
        .cadastro-avaliacao-page textarea:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            filter: none;
        }

        @media (max-width: 768px) {
            .cadastro-avaliacao-header {
                align-items: stretch;
                flex-direction: column;
            }

            .cadastro-avaliacao-actions {
                display: grid;
                grid-template-columns: 1fr;
                width: 100%;
            }

            .cadastro-avaliacao-actions button,
            .avaliacao-submit-actions button {
                margin-bottom: 0 !important;
            }

            .avaliacao-data-row {
                max-width: none;
            }

            .avaliacao-submit-actions {
                flex-direction: column-reverse;
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .growing-dots span {
                animation: none;
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<script src="../js/storage_normalizer.js"></script>
<nav>
    <div class="logo">ORDENA</div>
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir Menu" aria-expanded="false">☰</button>
</nav>

<div id="sidebar" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<script src="../js/menu.js"></script>

<main class="cadastro-avaliacao-page">
    <section class="card-container-main" aria-labelledby="tituloCadastroAvaliacao">
        <div class="cadastro-avaliacao-header">
            <h2 id="tituloCadastroAvaliacao">Cadastrar Avaliação</h2>

            <div class="cadastro-avaliacao-actions" role="navigation" aria-label="Navegação do cadastro de avaliação">
                <button type="button" class="filter-btn cadastro-link active" aria-current="page">Cadastrar</button>
                <button type="button" id="btnVerAvaliacoesCadastro" class="filter-btn" disabled>Ver avaliações</button>
                <button type="button" id="btnVoltarDetalhesCadastroAvaliacao" class="btn-voltar-operacao" disabled>Voltar para operação</button>
            </div>
        </div>

        <p class="cadastro-avaliacao-description">
            Registre uma avaliação para <strong id="nomeOperacaoCadastroAvaliacao">a operação selecionada</strong>.
        </p>

        <div id="cadastroAvaliacaoFeedback" class="operacao-feedback" aria-live="polite" tabindex="-1"></div>

        <div id="cadastroAvaliacaoLoading" class="cadastro-avaliacao-loading" role="status" aria-live="polite">
            Carregando cadastro
            <span class="growing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>

        <div id="cadastroAvaliacaoOperacaoConteudo" hidden>
            <form id="avaliacaoOperacaoForm" novalidate>
                <div class="row avaliacao-data-row">
                    <div class="col-1">
                        <label for="avaliacaoData">Data da avaliação <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
                        <input type="date" id="avaliacaoData" class="input-padrao" required aria-required="true" disabled>
                    </div>
                </div>

                <div class="row">
                    <div class="col-1">
                        <label for="avaliacaoTexto">Avaliação <span class="campo-obrigatorio" aria-hidden="true">*</span></label>
                        <textarea id="avaliacaoTexto" class="input-padrao" maxlength="2000" placeholder="Registre a avaliação da operação." required aria-required="true" disabled></textarea>
                    </div>
                </div>

                <div class="avaliacao-submit-actions">
                    <button type="button" id="btnCancelarAvaliacao" class="btn-secondary" disabled>Cancelar</button>
                    <button type="submit" id="btnSalvarAvaliacao" class="btn-success" disabled>Salvar avaliação</button>
                </div>
            </form>
        </div>
    </section>
</main>

<script src="../js/operacoes_especiais.js"></script>
</body>
</html>
